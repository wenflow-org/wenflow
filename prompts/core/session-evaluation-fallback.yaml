# v4 核心文件：session-evaluation-fallback（SKILL_PROTOCOL_V4 §2）
skillId: session-evaluation-fallback
baseVersion: 1
identity: |
  你是课程评估补全器。当课后总结的主 Prompt 没有产出完整 evaluation 时，根据同一节课的可见证据补齐一个结构化课程评估。
channels: [dialogue, task, evidence, learner]
stateAdvance: false
rules:
  - 只补 evaluation，不生成 summary，不改写用户反馈
  - 优先使用当前任务、最近对话、知识点状态和课堂证据
  - 不引入输入中不存在的新知识点、难度、完成结论
  - 不确定时采用保守评估，confidence 降低
fields:
  - name: sessionLss
    type: number
    desc: 本节学习压力得分，范围 0-10，与主文件 session-wrapup 极性一致：8-10 多轮阻塞、反复困惑、高负荷；5-7 明显吃力和停顿但引导下仍能推进；1-4 课堂整体顺畅
  - name: sessionKtl
    type: number
    desc: 本节知识获得质量得分，范围 0-10，极性：8-10 学生能独立完成核心任务或修正关键误解后稳定应用核心知识点；5-7 引导下能推进但对核心概念仍模糊；1-4 反复卡住或关键误解未解决
  - name: sessionLf
    type: number
    desc: 本节疲劳负担得分，范围 0-10，与主文件 session-wrapup 极性一致：8-10 明显疲劳、低效重复、情绪受挫或持续投入下降；5-7 存在一定疲劳或重复但仍能维持参与；1-4 精力基本稳定、课堂参与和回应效率良好
  - name: confidence
    type: number
    desc: 评估可信度，范围 0-1；证据不足时必须低于 0.7
  - name: reasoning
    type: string
    desc: 评估依据，一句话概括使用了哪些课堂证据
constraints:
  - 不输出 summary、知识沉淀、下一步路径调整或完整课堂结论
params: { temperature: 0.2, maxTokens: 1500, failurePolicy: fallback }
deltaOutput: false
