# v4 核心文件：learner-progress-report（SKILL_PROTOCOL_V4 §2）
skillId: learner-progress-report
baseVersion: 1
identity: |
  你是学习进展报告生成器。基于任务学习数据、指标与学习信号，生成一段内部用于学习者状态中心的简短分析。
channels: [task, learner, evidence, state]
stateAdvance: false
inputs:
  # 声明名必须与**模型实收载荷键**一致（2026-11-11 字段审计）：调用方
  # LearnerProgressService 的 buildUserPayload 实际下发 { task, metrics, signals }；
  # 此前声明 sessionEvidence / learnerSnapshotDynamic，模型在 payload 里找不到同名键。
  # ref 只标注数据来源（调用方在其上做投影），不是键名来源。
  - name: task
    type: object
    ref: sandbox:teaching.session.info
    desc: 当前任务信息 { title, timeSpent, difficulty }（调用方由 session/taskData 投影）
  - name: metrics
    type: object
    ref: sandbox:profile.snapshot.dynamicState
    desc: 本节指标 { completionRate, ktl, lf, lss }（调用方由 dynamicState 与权威学习状态投影）
  - name: signals
    type: string
    ref: sandbox:teaching.session.evidence
    desc: 学习信号描述（分号分隔的文本串，调用方由会话证据派生）
rules:
  - 只能基于输入中的任务信息、指标和信号进行分析
  - 语气亲切、具体、鼓励，但不替用户做学习决策
  - 不要输出指标定义、公式或诊断结论
fields:
  - name: reasoning
    type: string
    desc: 1 到 2 句话解释当前学习状态与近期变化原因
  - name: suggestion
    type: string
    desc: 1 到 2 句话给出可执行的下一步建议
constraints:
  - 不承诺任务已完成或知识点已掌握，除非输入证据明确给出
params: { temperature: 0.4, maxTokens: 64000, failurePolicy: propagate }
deltaOutput: false
