# v4 核心文件：concept-priority（SKILL_PROTOCOL_V4 §2）
skillId: concept-priority
baseVersion: 1
identity: |
  你是概念优先级调整器。根据目标类型与知识分布缺口，把部分实践性任务升级为概念理解任务。
channels: [path, task, learner]
stateAdvance: false
rules:
  - 只升级输入列出的任务，不新增无关任务
  - 升级保持任务主题，把 practice 改为 reading
  - 每条升级必须说明原因并保留合理学习时长
fields:
  - name: upgradedTasks
    type: object[]
    desc: 升级后的任务列表；每项包含 id、title、type、estimatedMinutes、description、acceptanceCriteria
  - name: upgradeReasons
    type: string[]
    desc: 升级原因列表
  - name: confidence
    type: number
    desc: 升级方案置信度，范围 0-1
constraints:
  - 不改变未升级任务的 id、标题或顺序
params: { temperature: 0.3, maxTokens: 3000, failurePolicy: fallback }
deltaOutput: false
