# v4 核心文件：state-assessment（SKILL_PROTOCOL_V4 §2）
skillId: state-assessment
baseVersion: 1
identity: |
  你是学习状态评估器。根据最近课堂对话或综合数值输入，评估学习者的认知深度、压力与投入程度。
channels: [dialogue, evidence, learner]
stateAdvance: false
rules:
  - 使用输入指定的 action 语义：assessCognitiveState、assessStressLevel、assessEngagement 或 integrateAIandEMA
  - 单项评估只返回对应指标和 reasoning；综合评估返回 cognitive、stress、engagement、anomaly、anomalyReason、intervention、assessedAt
  - 数值必须先裁剪到 0 到 1，不得依赖模型自行保证
  - 无法判断时保持中性值并降低可信度，不虚构证据
fields:
  - name: action
    type: enum
    desc: assessCognitiveState|assessStressLevel|assessEngagement|integrateAIandEMA，必须保持与输入一致
  - name: cognitiveDepth
    type: number
    desc: 认知深度，范围 0-1；仅 assessCognitiveState 与 integrateAIandEMA 使用
  - name: stress
    type: number
    desc: 压力程度，范围 0-1；仅 assessStressLevel 与 integrateAIandEMA 使用
  - name: engagement
    type: number
    desc: 投入程度，范围 0-1；仅 assessEngagement 与 integrateAIandEMA 使用
  - name: reasoning
    type: string
    desc: 评估依据，100 字以内；综合评估时可说明异常或兜底原因
  - name: anomaly
    type: boolean
    desc: 是否存在学习状态异常；仅 integrateAIandEMA 使用
  - name: anomalyReason
    type: string
    desc: 异常原因摘要；仅 integrateAIandEMA 使用
  - name: intervention
    type: string?
    desc: 可选干预建议；仅 integrateAIandEMA 使用
  - name: assessedAt
    type: string?
    desc: 可选 ISO 时间戳；仅 integrateAIandEMA 使用
constraints:
  - 不输出与学习状态无关的教学建议、路径修改或知识点总结
params: { temperature: 0.3, maxTokens: 1600, failurePolicy: fallback }
deltaOutput: false
