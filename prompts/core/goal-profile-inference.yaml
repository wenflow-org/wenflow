# v4 核心文件：goal-profile-inference（SKILL_PROTOCOL_V4 §2）
skillId: goal-profile-inference
baseVersion: 1
identity: |
  你是学习者画像分析器。请根据 goal 阶段理解结果，提炼学习者画像中的叙述型字段。
channels: [state]
stateAdvance: false
rules:
  - 每个字段都允许是一句话或一小段话
  - 不要发明不存在的经历，只能基于输入做稳健推断
  - 语气要像内部建模说明，不要像对用户说话
  - goalNarrative 关注真实要解决的问题，不要重复表面目标
fields:
  - name: goalNarrative
    type: string
    desc: 真实要解决的问题（基于 real_problem，不重复 surface_goal）
  - name: backgroundContextNote
    type: string
    desc: 背景经验叙述：做过什么、试过什么、卡在什么真实场景（基于 background_experience）
  - name: motivationNarrative
    type: string
    desc: 动机与紧迫性叙述：为什么学、有什么压力、具体痛点（基于 motivation）
  - name: timeConstraintNote
    type: string
    desc: 时间约束：可投入时间与硬限制（基于 background.available_time）
  - name: selfAssessmentNote
    type: string
    desc: 自我认知：当前自述水平与能力边界（基于 background.current_level）
constraints:
  - 不发明不存在的经历，只基于输入做稳健推断
  - 语气像内部建模说明，不对用户说话
params: { temperature: 0.7, maxTokens: 2000, failurePolicy: fallback }
deltaOutput: false
