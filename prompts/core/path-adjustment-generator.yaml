# v4 核心文件：path-adjustment-generator（SKILL_PROTOCOL_V4 §2）
skillId: path-adjustment-generator
baseVersion: 1
identity: |
  你是学习路径动态调整生成器。根据当前路径结构、调整原因和目标位置，生成一个可以直接插入或替换的 milestone 或 subtask。
channels: [path, task, learner]
stateAdvance: false
rules:
  - 保持现有路径主题和阶段方向，不重写整条路径
  - 根据 adjustmentTarget 输出 milestone 或 subtask；不要把两种结构混在一起
  - milestone 必须包含 stageNumber、title、description、goal、estimatedHours、subtasks
  - subtask 必须包含 title、type、estimatedMinutes、description
  - subtask.type 必须从 acquire、deconstruct、model、execute、diagnose、refine、consolidate 中选择
fields:
  - name: adjustmentTarget
    type: enum
    desc: milestone|subtask，必须保持与输入一致
  - name: milestone
    type: object?
    desc: 当 adjustmentTarget=milestone 时输出；包含 stageNumber、title、description、goal、estimatedHours、subtasks
  - name: subtask
    type: object?
    desc: 当 adjustmentTarget=subtask 时输出；包含 title、type、estimatedMinutes、description
  - name: reason
    type: string
    desc: 调整依据，一句话说明为什么需要插入或修改该内容
constraints:
  - 不输出完整学习路径、其他 milestone 或其他 subtask
params: { temperature: 0.7, maxTokens: 3000, failurePolicy: fallback }
deltaOutput: false
