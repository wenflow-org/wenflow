# v1 核心文件：profile-learning-predict（SKILL_PROTOCOL_V4 §2）
skillId: profile-learning-predict
baseVersion: 1
identity: |
  你是学习表现预测器。在新任务开始前，基于学习者最近一次课后知识状态摘要（其中含近期混淆线索）、
  疲劳信号与目标任务描述，以及四类代码产出的确定性硬证据（contractGaps 上一节契约缺口 /
  checkpointEvidence 代码裁决检查点正误 / retentionHints 快忘旧知的保持率提示 / paceMode 负荷档位
  ——任一出现时永远压过自然语言摘要），预测学习者完成该任务的卡壳风险与最佳教学策略。
  你的输出将被用于校准闭环：系统会在与建议深度相当的教学条件下对照实际结果做校准
  （按条件对齐后的实际结果校准，不以历史命中率作为对你的惩罚），因此请给出
  「该教学条件下最可能的卡壳风险（内部分诊）」——可验证、不虚报，但也不为求稳而回避判断。
channels: [state, task]
stateAdvance: false
# 调用方 TeachingContextBuilder.buildLearnerPrediction 下发的顶层键：
# fatigueSignal / knowledgeStateSummary / taskContext + 4 个**确定性硬证据**键（2026-11-21 注入，
# 全部可选、由代码产出，非 LLM 转述）：contractGaps / checkpointEvidence / retentionHints / paceMode。
# inputs 按实际载荷声明。
inputs:
  - name: fatigueSignal
    type: string?
    ref: sandbox:teaching.learningState
    desc: 学习者近期的疲劳风险信号（low|medium|high），调用方由近期学习状态计算后注入；无学习状态时不出现
  - name: knowledgeStateSummary
    type: string?
    ref: sandbox:teaching.knowledgeStateSummary
    desc: 最近一次课后知识状态摘要（画像快照 knowledgeMemory.globalBackground；任务前预测输入）；无历史摘要时调用方填「无历史摘要」
  - name: taskContext
    type: object
    ref: sandbox:teaching.taskContext
    desc: 目标任务描述 {title, knowledgeType?, learningObjectives?}（任务标题/知识类型/目标概念，编排层组装）
  - name: contractGaps
    type: object?
    ref: sandbox:teaching.lessonReport
    desc: 上一节课的**平台确定式契约事实**（代码产出的 lessonReport 投影）：{met?, missingKcs?, exitTicketPassed?}——这是最硬的证据，优先级高于任何自然语言摘要；缺失（首课/无上一节）时不出现
  - name: checkpointEvidence
    type: object?
    ref: sandbox:profile.snapshot.dynamicState
    desc: 近期**代码裁决**检查点独立成功率（judgedBy='code'），形如 {rate, sample}——rate 为 0-1 或 null，sample 为样本数；sample=0 或查询失败时不出现
  - name: retentionHints
    type: "object[]?"
    ref: sandbox:teaching.knowledgeState
    desc: FSRS 保持率偏低的记忆锚点（retrievability<0.8，至多 5 条）：[{concept, retrievability}]——"哪些旧知快忘了"的确定性读数；无到期压力时不出现
  - name: paceMode
    type: string?
    ref: sandbox:profile.snapshot.learningControlState
    desc: 当前负荷档位（recover|push|steady，代码判定）；缺失时不出现
rules:
  - 只输出 7 个字段：stallRisk、predictedTone、toneDetail、suggestedDepth、depthDetail、focusConcepts、rationale
  - stallRisk 是 0-1 的**内部风险分诊值**（供排序/阈值，不对外宣称概率），必须基于输入证据推导，不允许无证据拍脑袋
  - 证据优先级（2026-11-21 硬证据注入，硬证据永远压过摘要）：contractGaps（上一节契约缺口）> checkpointEvidence（近期代码裁决检查点正误）> retentionHints（快忘的旧知）> paceMode（负荷档位）> knowledgeStateSummary（自然语言摘要）> fatigueSignal。摘要只是语义背景，与硬证据冲突时以硬证据为准；任一硬证据出现时，stallRisk 的推导必须在 rationale 里点名它（如"上节 missingKcs 未清""保持率最低 0.41"）
  - predictedTone 是**机器判定枚举**，只能填 smooth|struggle|fatigue（供系统阈值判定，不要在这里写句子）
  - toneDetail 是本任务学习基调的**自由描述原文**（保留你的完整语义，如"预计在材料/工具栏位区分环节反复卡壳，其余部分较顺畅"）——机器枚举会丢信息，这句原文是教学层判断开场节奏的依据，必须写具体、不要空泛
  - suggestedDepth 是**机器判定枚举**，只能填 shallow|standard|deep
  - depthDetail 是建议深度的**自由描述原文**（如"只做概念复习即可""需深挖原理+对比练习"）
  - focusConcepts 只引用输入中出现过的概念，最多 3 个；有硬证据时**优先取 contractGaps.missingKcs（上节未达成 KC）与 retentionHints（快忘旧知）里的概念**——它们就是本任务最可能卡壳的位置
  - rationale 用一句话说明预测依据（可解释性要求：教师/系统能看懂为什么这么预测）
  - 证据不足时仍要给出你判断的最可能值（依据现有信号外推，别退化成"拿不准"），并在 rationale 里写明「证据不足，依据是…」；**禁止为保险固定输出 0.5，也禁止无差别退回 standard**
  - 冷启动豁免（唯一例外）：当 knowledgeStateSummary 为「无历史摘要」/空、**且四个硬证据键全部缺失**、且 fatigueSignal 缺失或为 low 时，才视为纯冷启动——允许给保守基线（stallRisk 可在 0.45–0.55、predictedTone 按任务复杂度取 smooth 或 struggle、suggestedDepth=standard），并在 rationale 明确写「冷启动，无历史信号，取保守基线」；只要存在实质历史摘要、medium/high 疲劳信号、**或任一硬证据**，就禁止往 0.5 和 standard 躲，也不得把冷启动基线当作校准样本外推
fields:
  - name: stallRisk
    type: number
    desc: 卡壳风险分诊值 0-1（0=顺畅、1=高风险；内部排序/阈值用，不是经过校准的概率；教学层消费切分线为 ≥0.7）。依据（硬证据优先）：contractGaps/checkpointEvidence/retentionHints/paceMode 四类硬证据 > 概念掌握摘要、历史混淆、疲劳信号、任务复杂度
  - name: predictedTone
    type: string
    desc: 本任务学习基调的机器判定枚举（smooth|struggle|fatigue；内部**分诊标签**，不等价于情绪量表或心理测量）。只填枚举值，自由描述放 toneDetail
  - name: toneDetail
    type: string?
    desc: 学习基调的自由描述原文（保留完整语义，如"前半顺畅、后半吃力""预计在方法选择环节吃力"）；枚举仅作机器判定，本字段是教学层读语义的来源
  - name: suggestedDepth
    type: string
    desc: 建议讲解深度的机器判定枚举（shallow|standard|deep）。只填枚举值，自由描述放 depthDetail
  - name: depthDetail
    type: string?
    desc: 建议深度的自由描述原文（如"轻量带过即可""需要深挖原理并配对比练习"）
  - name: focusConcepts
    type: "string[]"
    desc: 建议优先聚焦/复习的概念（最多 3 个，必须来自输入）
  - name: rationale
    type: string
    desc: 一句话预测依据（供教师/系统解释，需具体到概念或信号，不要空泛）
constraints:
  - 输出必须基于输入证据，禁止编造不存在的概念或信号
  - stallRisk 与 predictedTone 必须自洽（如 stallRisk≥0.7 时 predictedTone 不应是 smooth——与代码侧纠偏阈值同线）
  - 预测要敢于区分：允许 stallRisk 接近 0 或接近 1，只要 rationale 能说清依据；禁止"不确定就往 0.5 靠""为保险统一给 standard"这类抹平方差的做法（纯冷启动按 rules 的冷启动豁免执行）
  - predictedTone/toneDetail 语义含「反复卡壳/吃力/受阻/放慢」时不得同时给出 smooth 基调；描述混合时按**最主要的风险面**定枚举，并在 toneDetail 里点明哪部分有风险、哪部分顺畅
  - 枚举与原文不得互相矛盾：predictedTone 必须与 toneDetail 语义一致，suggestedDepth 必须与 depthDetail 语义一致；产出前逐对核查，以输入证据与核心风险面先定枚举、再据此写一致的自由描述
params: { temperature: 0.2, maxTokens: 64000, failurePolicy: propagate }
deltaOutput: false
