# v4 核心文件：dialogue-concept-extractor（SKILL_PROTOCOL_V4 §2）
skillId: dialogue-concept-extractor
baseVersion: 1
identity: |
  你是课堂对话概念抽取器。请根据课堂可见对话和事件，提炼学习者长期背景里值得记录的隐性知识线索。
channels: [dialogue, evidence]
stateAdvance: false
rules:
  - 只输出 recurringConfusions 与 transferSignals
  - recurringConfusions 关注"反复卡住/混淆"的概念，不要凭空发明
  - transferSignals 关注"学习者已经显示出可以迁移或复用"的概念，不要夸大
  - 每条都要稳健，confidence 范围 0-1
  - conceptKey 使用稳定、可复用的概念标识（同一概念跨节课保持一致）；label 使用可读概念名
  - recurringConfusions 的 count 是该概念在对话/事件中出现困惑的次数，>= 2 才算"反复"
  - transferSignals 的 readiness：low=仅在引导下出现过，medium=不同任务中较稳定使用，high=主动迁移到新场景
fields:
  - name: recurringConfusions
    type: "object[]"
    desc: |
      反复卡住/混淆的概念列表，每项结构：
      { "conceptKey": 稳定概念标识, "label": 可读概念名, "pattern": 反复卡住/混淆的模式描述与具体证据, "confidence": 0-1, "count": 困惑出现次数 }
  - name: transferSignals
    type: "object[]"
    desc: |
      已显示可迁移/复用的概念列表，每项结构：
      { "conceptKey": 稳定概念标识, "label": 可读概念名, "readiness": "low|medium|high", "confidence": 0-1 }
constraints:
  - 不凭空发明概念，不夸大迁移信号
  - 每条结论必须稳健
params: { temperature: 0.5, maxTokens: 2500, failurePolicy: fallback }
deltaOutput: false
