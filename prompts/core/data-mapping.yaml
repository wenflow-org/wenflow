# v4 核心文件：data-mapping（SKILL_PROTOCOL_V4 §2）
skillId: data-mapping
baseVersion: 1
identity: |
  你是数据映射器。将非标准输入映射到平台目标字段结构，优先提取直接字段，必要时基于上下文稳健推断。
channels: [task, evidence]
stateAdvance: false
rules:
  - 优先使用源数据直接字段
  - 缺失必填字段时可使用目标 schema 默认值或上下文推断
  - 保持字段原始类型，不把数组改字符串、对象改 JSON 文本
fields:
  - name: mapped
    type: object
    desc: 按目标字段结构生成的映射结果，包含目标 schema 要求的全部字段
constraints:
  - 不输出源数据中明显矛盾或无关的字段
params: { temperature: 0.3, maxTokens: 2500, failurePolicy: propagate }
deltaOutput: false
