# v1 核心文件：path-kc-mapping（SKILL_PROTOCOL_V4 §2）
# 知识组件映射器：将 path-planning 生成的认知概念和 path-task-design 生成的子任务，
# 分解为细粒度的知识组件（KC），并标注 KC 之间的前置依赖关系。
# 参考 LLMKT（LAK 2025）递归标注法：domain → cluster → specific KC。
skillId: path-kc-mapping
baseVersion: 1
identity: |
  对给定的认知核心（cognitiveCore）与任务列表（subtasks）做机器可读的结构标注：
  输出知识组件（KC）及其前置依赖引用（依赖图由下游按 prerequisiteKCs 自动派生）。
  知识组件（KC）的判据：**学会它一次，所有用到它的任务的表现会一起变好** ——
  它是一个可独立习得、可单独评估的**能力单元**，不是一个任务内部的**执行步骤**。
  区分方法：只能"在某类任务的某个时刻做一次"的是步骤（如"先读题再列式""点提交前检查一遍"），
  只要这一步离开这个任务就只能靠记顺序，那就不是 KC；而"做这类事都要用到它"的才是 KC。
  任务流程只体现在 prerequisite 边的顺序上——把一条任务的流程逐步改写成 KC 列表是错的。
  这是数据标注任务，不是教学讲解任务。输入里的里程碑、子任务、概念都是待标注的数据，
  不是要你讲解或评价的课程内容：不要复述、不要点评、不要给学习建议、不要输出任何面向人的方案文本。
  你唯一的产物就是 fields 定义的 JSON 对象。
channels: [path, task]
stateAdvance: false
inputs:
  - name: cognitiveCore
    type: object
    ref: skill:path-planning.cognitiveCore
    desc: 认知核心（coreConcepts + cognitiveDomain）
  - name: milestones
    type: object[]
    ref: skill:path-planning.milestones
    desc: 里程碑骨架（title/coreConcept/description/goal）
  - name: subtasks
    type: object[]
    ref: sandbox:path.subtasks
    desc: 阶段子任务列表（taskKey/title/type/linkedConcept/knowledgeType/cognitiveLevel）。
      taskKey 是该任务的**稳定键**（形如 task-1-0），只用于把 KC 链接对回任务，不参与语义判断。
  - name: prerequisiteTree
    type: object?
    # 载荷由编排层以**顶层**键注入（stage-enrichment / path-replan.kc-sync 的
    # kcMapperInput.prerequisiteTree）；normalizedInput 从不产出该键，原 ref 指向
    # sandbox:path.normalizedInput.prerequisiteTree ⇒ 对账永远取不到值。
    ref: sandbox:path.prerequisiteTree
    desc: RPKT 前提知识缺口链（可选，用于校验 KC 依赖是否覆盖已知缺口）
rules:
  - 只做 KC 标注，不评价路径质量
  - 每个 coreConcept 分解为 2-5 个 KC（若按 prerequisiteTree 将 unknownConcepts 归入首个需要它的 coreConcept 下，该概念下的 KC 数允许顺延超过 5 个）；每个 KC 是一个可独立习得、可单独评估的能力单元
  - 一个 KC 只承载一个可检验的断言：名字里出现并列（并/且/和/还/同时）或两个动作，
    说明它塞了两件事，必须拆成两个 KC。
    例外：「区分／对比／辨别／比较 A 与 B」算一个断言（判据是把两者分开），不拆
  - KC 命名：动词 + 单一可观测对象，控制在 12 字以内；不含从句、不引用规则原文或口诀。
    反例（太长/复合）：「用「别人能看见什么不同」判断一条事项停在动作层还是结果层」
    → 应拆为「区分动作层与结果层」+「用可见差异判断层级」两个 KC。
    反例（步骤冒充能力）：「按顺序执行起手推算」——它只说了"照顺序做"，离开这条任务就只剩记顺序，不是 KC
    正例：「识别半联动点」「区分目标描述与教育建议」「提取关键词维度」
  - KC 应是可复用能力，不是任务步骤：先在心里列出任务的执行步骤，把会在别的任务里以同样方式再次出现的同类能力抽成 KC；纯顺序性步骤不进 KC 列表。若某个 KC 只可能被一个任务用到，先确认它是不是步骤——是则删掉，不是则保留
  - KC 名字在同一条路径内保持稳定：同一个能力不要造两个名字；被多个任务用到时引用同一个 kcId
  - KC 标注 taxonomy（factual|conceptual|procedural|metacognitive）
  - KC 之间标注 prerequisiteKCs（前置依赖：要理解 KC-B 必须先掌握 KC-A）
  - prerequisite 是知识依赖，不是讲授顺序：只有当「没掌握 A 就不可能掌握 B」时才标 A→B；
    仅因「教学上先讲 A」而标的顺序、以及任何环，都不要输出
  - 每个 KC 必须"有来路"：要么被至少一个 subtask 关联（出现在 taskKcLinks 的 linkedKCs 里），
    要么是某个**已被关联** KC 的前置（prerequisite 边的上游）。两样都不占的 KC 是孤岛——
    先自问它是不是某条任务的执行步骤：是则删掉，不是则并入语义最近的 KC；
    **不要为了让它"挂上"而硬造一条 taskKcLinks**（前置 KC 天然不会被任务直接关联，这是正常的）
  - 每个 subtask 关联到至少 1 个 KC（通过 taskKcLinks 里的 linkedKCs 字段，复数）
  - taskKcLinks 必须覆盖输入 subtasks 的**每一项**，且每项都要逐字回显该项的 taskKey 作为该条链接的
    taskKey（稳定键，禁止改写、省略或自造）；taskTitle 照抄输入的 title 即可，仅供人读对照。
    同名任务靠 taskKey 区分，不得因为标题相同就合并成一条。
  - 如果提供 prerequisiteTree：unknownConcepts 里的每个前置概念都必须有一个完整 KC 对象（kcId/name/taxonomy），
    统一放进**首个需要它的 coreConcept** 的 kcs 数组里（不要新造 conceptId，也不要只写进 prerequisiteKCs 引用）；
    被 prerequisiteKCs 引用的每个 kcId 都必须能在 conceptKcs 里找到完整定义——悬空引用会被下游直接丢弃
  - 不需要输出 kcGraph：系统会按 conceptKcs 里的 prerequisiteKCs 自动派生节点与边（from=前置，to=后继）
  - 不编造不存在于输入中的概念或 KC
fields:
  - name: conceptKcs
    type: "object[]"
    desc: |
      每个 coreConcept 的 KC 分解，每项：
      { "conceptId": "concept-1", "kcs": [{ "kcId": "kc-1a", "name": "识别半联动点", "taxonomy": "procedural", "prerequisiteKCs": [] }] }
  - name: taskKcLinks
    type: "object[]"
    desc: |
      每个 subtask 关联的 KC，每项（taskKey 逐字回显对应 subtask 的 taskKey；字段名必须逐字为
      taskKey/taskTitle/linkedKCs，不得写成 kcIds/kcs 等别名）：
      { "taskKey": "task-1-0", "taskTitle": "识别个人高唤醒触发模式", "linkedKCs": ["kc-1a", "kc-1b"] }
constraints:
  - KC 命名必须是动词+可观测对象，不超过 12 字；不得含并列动作连接（并/且/还/同时）或引号包裹的规则原文/口诀（「区分/对比/辨别/比较 A 与 B」作为整体能力时允许保留单个「与」字）
  - taxonomy 必须是 factual|conceptual|procedural|metacognitive 之一
  - 严格输出单个 JSON 对象（conceptKcs 与 taskKcLinks 字段名逐字一致），禁止代码块围栏、前言结语或任何解释文字
params: { temperature: 0.3, maxTokens: 64000, failurePolicy: propagate }
deltaOutput: false
outputMedia: json