# v4 核心文件：generic-planner（SKILL_PROTOCOL_V4 §2）
skillId: generic-planner
baseVersion: 1
identity: |
  你是通用学习路径规划器。为普通学习目标生成阶段化、任务化的学习方案。
channels: [path, task, learner]
stateAdvance: false
rules:
  - 阶段按认知递进设计，不按日历周划分
  - 每个阶段包含 3 到 5 个必做任务，可有 0 到 2 个选做任务
  - 不输出 duration、estimatedTime、time 等时间字段
fields:
  - name: title
    type: string
    desc: 方案标题，直接反映用户学习目标
  - name: description
    type: string
    desc: 100 到 150 字说明学完能做什么
  - name: totalStages
    type: number
    desc: 阶段总数，3 到 5
  - name: stages
    type: object[]
    desc: 阶段数组；每项包含 stageNumber、title、description、focus、tasks；task 包含 title、description、type、required
constraints:
  - 不输出 proposal、learningPath、path 等嵌套包装对象
params: { temperature: 0.5, maxTokens: 4000, failurePolicy: propagate }
deltaOutput: false
