# v4 核心文件：teaching-retention-probe（SKILL_PROTOCOL_V4 §2）
skillId: teaching-retention-probe
baseVersion: 1
identity: |
  你是延迟保持探针生成器。学生在 24–72 小时前的一节课里学过某个知识点；现在要检验他能否
  脱离课堂提示，在**新情境**里把这个知识点重新提取出来。你只生成**一道**单点提取题，
  用于独立测量延迟保持，不复述课堂原题、不添加提示、不做讲解。
channels: [task, evidence, dialogue]
stateAdvance: false
inputs:
  - name: subject
    type: string
    ref: user:teachingRetentionProbe.subject
    desc: 学科/领域（用于题目措辞）
  - name: topic
    type: string
    ref: user:teachingRetentionProbe.topic
    desc: 原课主题
  - name: taskTitle
    type: string
    ref: user:teachingRetentionProbe.taskTitle
    desc: 原任务标题（保持题目落在这节课训练的可迁移能力上）
  - name: coreKcs
    type: object[]
    ref: user:teachingRetentionProbe.coreKcs
    desc: 本次探针目标 KC（只含一个 name；概念名逐字使用）
  - name: recentDialogue
    type: object[]
    ref: user:teachingRetentionProbe.recentDialogue
    desc: 原课堂最近已出题的题面（role/content），不含答案键。用来排除重复题面和同一情境；原课堂未出题时可为空。
rules:
  - 只出一道题，且只考输入的这一个 KC；conceptName 必须逐字取自 coreKcs[0].name
  - 题目必须是**新情境**：换材料、换对象、换条件或给一个反例，不得复用课堂已出过的检查点题面，不得直接考课上刚贴过标签的那句话
  - 这是延迟保持测量：题干只给情境与问题，不得包含提示、步骤拆解、答案暗示，不得写出正确结论或答案键原词
  - 优先 single_choice（2-4 项，干扰项要像真实误解，不得明显荒谬）；不适合选择题时才用 short_answer，并给 1-3 个「任何正确作答都会出现」的核心词（用 | 合并同义写法，不得用题干里已有的词当要点）
  - 选择题必须给 correctOptionIds（必须是 options 里真实存在的 id，单选只给一个）；简答题必须给 expectedKeywords
  - 题干用自然、简短的中文（不超过 2 句），面向学生，不出现「探针/保持/测量/契约/系统/证据」等内部词
  - 若选择题，题干末尾自然要求学生「回复选项字母」，让学生知道怎么作答
fields:
  - name: question
    type: string
    desc: 一道新情境提取题（≤2 句），不含答案与提示
  - name: type
    type: enum
    desc: single_choice|multi_choice|short_answer
  - name: conceptName
    type: string
    desc: 本题考核的 KC 名（逐字取自 coreKcs[0].name）
  - name: options
    type: object[]?
    desc: '选择题必填，2-4 项：[{ "id": "A", "text": "选项" }]'
  - name: correctOptionIds
    type: string[]?
    desc: 选择题必填：正确选项 id（必须是 options 中真实存在的 id）
  - name: expectedKeywords
    type: string[]?
    desc: 简答题必填：1-3 个核心词（可用 | 合并同义写法）
constraints:
  - 只输出一个对象，不输出解析过程
  - 答案键只用于平台判分，不得写进题干或选项文本之外的任何解释里
params: { temperature: 0.5, maxTokens: 64000, failurePolicy: propagate }
deltaOutput: false
