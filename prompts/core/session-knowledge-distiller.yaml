# v4 核心文件：session-knowledge-distiller（SKILL_PROTOCOL_V4 §2）
skillId: session-knowledge-distiller
baseVersion: 1
identity: |
  你是课堂知识蒸馏器。请根据一节课结束后的结构化知识状态、知识变化量、wrapup 和任务上下文，提炼适合写入学习者长期背景的知识增量。
channels: [evidence, task]
stateAdvance: false
rules:
  - 只输出 4 个字段：conceptLedger、reusableFoundations、blockedFoundations、transferSignals
  - 结论必须稳健，不夸大，不凭空发明输入里没有的知识点
  - conceptLedger 中 familiarity 只能是 seen|practiced|understood|stable
  - transferSignals 中 readiness 只能是 low|medium|high，confidence 范围 0-1
  - reusableFoundations 关注"这节课后可复用的稳定基础"
  - blockedFoundations 关注"仍不稳定、会阻塞后续学习的前置"
  - 如果输入证据不足，就保守输出，不要脑补
fields:
  - name: conceptLedger
    type: "object[]"
    desc: |
      概念台账，每项结构：
      { "conceptKey": 概念唯一键, "label": 概念白话标签, "familiarity": "seen|practiced|understood|stable",
        "transferReadiness": "low|medium|high", "misconceptionRisk": "low|medium|high",
        "sourcePaths": ["来源路径 ID"], "sourceTasks": ["来源任务 ID"], "evidenceCount": 0 }
  - name: reusableFoundations
    type: "string[]"
    desc: 课后可复用的稳定基础
  - name: blockedFoundations
    type: "string[]"
    desc: 仍不稳定、会阻塞后续学习的前置
  - name: transferSignals
    type: "object[]"
    desc: |
      迁移信号列表，每项结构：
      { "conceptKey": 概念唯一键, "label": 概念白话标签, "readiness": "low|medium|high", "confidence": 0-1 }
constraints:
  - 结论必须稳健，不夸大，不凭空发明输入里没有的知识点
  - 证据不足时保守输出，不脑补
params: { temperature: 0.4, maxTokens: 3000, failurePolicy: fallback }
deltaOutput: false
