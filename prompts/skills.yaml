    description: 对路径生成结果做 CIDDP 五维度评审，低于阈值输出重规划指令
    coordinator:
      agentId: path-agent
      steps: []
    dataSource:
      sandbox: [path]
    notes: service 侧调用（learning.service.ts 内联评审，非 path.coordinator 编排），不在 path.definition.ts steps 内

  - skillId: kc-mapper
    kind: mainline
