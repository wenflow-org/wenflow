    description: 细化阶段内的任务与验收点
    coordinator:
      agentId: path-agent
      steps:
        - { step: 3, role: stage-task-expansion, loopOver: milestones }
    dataSource:
      db:
        - table: learning_paths
          keys: [aiPromptTemplate]
          via: prisma
        - table: milestones
          via: prisma
        - table: subtasks
          via: prisma
        - table: agent_field_routings
          via: routings
