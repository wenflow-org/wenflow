    coreFile: prompts/core/path-planning.yaml
    displayName: 路径规划 Skill
    description: 生成学习路径主结构
    coordinator:
      agentId: path-agent
      steps:
        - { step: 2, role: cognitive-core-and-milestones }
    dataSource:
      db:
        - table: goal_conversations
          keys: [collectedData]
          via: prisma
