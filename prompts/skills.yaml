# prompts/skills.yaml —— skill 户口簿（跨阶段技能注册唯一声明源，File-as-Truth）
#
# 定位：全部"活跃" skill（mainline / aux / handler-only）的注册登记唯一声明源。
# 消费方：agent-manifest.service.ts（agentMembers 由 parentAgent 运行时派生，P1）、
#         skills:check 校验器（F1~F12）、coordinator 挂接点校验、admin 向导（P5 预留）。
# 规格：doc/SKILLS_YAML_SPEC.md（schema §1、校验清单 §2.4、迁移 §3、风险回滚 §5）。
#
# 维护规则：
# 1. 新增 skill：追加一行（kind/stage/parentAgent/handlerRef/coreFile/displayName/description），
#    并四同步：prompts/core/<id>.yaml、backend/src/skills/<id>/index.ts + skills/index.ts 注册、
#    mainline 还需进 prompts/orchestration/<stage>.yaml contracts（铁律，F3 校验）。
# 2. 退役 skill：**不放进本文件**（从 skills[] 移除）；名单执行权威 =
#    backend/src/skills/retired-skills.ts（PURGED_SKILLS / ALL_RETIRED_SKILLS），
#    本文件只做活跃/退役互斥校验（F8）。僵尸项（basic-evaluator / goal-alignment-checker /
#    course-design）保留登记为 aux，notes 注明状态，禁止进退役名单。
# 3. 字段路由边界：prompts/orchestration/<stage>.yaml 仍是字段路由数据面唯一声明源
#    （本文件不承载 prompt 文本/字段语义）；coordinator 块只做挂接点登记（F10 校验 +
#    向导粘贴片段，definition.ts 保持手写权威）。
# 4. registrationPoint 例外账：learner-model → agents（backend/src/agents/ 注册）、
#    semantic-freeze-judge → platform-direct（平台守门直调，豁免 handler 注册检查）。

version: 1

# ============ goal-agent 下辖（mainline） ============
skills:
  - skillId: goal-conversation
    kind: mainline
    stage: goal
    parentAgent: goal-agent
    handlerRef: backend/src/skills/goal-conversation/index.ts
    coreFile: prompts/core/goal-conversation.yaml
    displayName: 目标对话 Skill
    description: 与学习者多轮对话，收集学习目标
    aliases: [goal-conversation-agent, goal-conversation]
    coordinator:
      agentId: goal-agent
      steps:
        - { step: 1, role: goal-clarification, loopOver: conversation-rounds, condition: until goal confirmed }
    dataSource:
      db:
        - table: goal_conversations
          keys: [collectedData]
          via: prisma
      sandbox: [goal]
    notes: deltaOutput 试点；alias goal-conversation 为裸名旧 id 兼容（Phase 3）

  # ============ path-agent 下辖（mainline） ============
