    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: analysis.ktEstimate
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: summary.knowledgeItems
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: evaluation.sessionLss
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: evaluation.sessionKtl
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: evaluation.sessionLf
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
