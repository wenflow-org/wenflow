# Teaching 阶段编排文件（字段路由单源化）
# 由字段路由 seed TS 机械迁移（1:1）；seed TS 已退役，本文件为唯一声明源。
# 2026-08 词汇统一批次：路由表 fieldId 去除 agent 前缀（peer.*/wrapup.*/* → 顶层），
# 仅影响路由表身份与展示层，不改变 coordinator/blackbox 的运行时 JSON 键。

stage: teaching
order: 3
displayName: 教学阶段
description: 授课执行：Teaching Turn → Peer/Checkpoint → Wrapup

contracts:
  - agentId: skill:teaching-turn
  - agentId: skill:peer-reinforcement
  - agentId: skill:session-wrapup
  - agentId: teaching-agent

fields:
  # === skill:teaching-turn 产出 ===
  - fieldId: reply
    promptRole: public-reply
    valueType: string
    persistKey: messages[].content
    description: 教学回合的对话回复（落库为消息正文）
    systemLocked: true
  - fieldId: analysis.cognitiveLevel
    promptRole: hidden-inference
    valueType: string
    description: 学习者认知层级（Bloom 等级）
  - fieldId: analysis.levelScore
    promptRole: hidden-inference
    valueType: number
    description: 认知层级量化分数
  - fieldId: analysis.understanding
    promptRole: hidden-inference
    valueType: number
    description: 本轮理解程度 0-1
  - fieldId: analysis.confusionPoints
    promptRole: hidden-inference
    valueType: array<string>
    description: 本轮检测到的困惑点
  - fieldId: analysis.engagement
    promptRole: hidden-inference
    valueType: number
    description: 本轮参与度 0-1
  - fieldId: analysis.emotionalState
    promptRole: hidden-inference
    valueType: string
    description: 情绪状态推断（enum positive|neutral|frustrated|confused|bored）
  - fieldId: analysis.loadIndex
    promptRole: hidden-inference
    valueType: number
    description: 本轮合成认知负荷 0-1（语义挣扎为主，结构/节奏为强化信号；干预路由与课后 session_load 聚合消费）
  - fieldId: analysis.loadBasis
    promptRole: hidden-inference
    valueType: string
    description: loadIndex 的主要判断依据（enum semantic|structure|pacing|combined|absent；无证据时 loadIndex=0.5/loadBasis=absent）
  - fieldId: analysis.misconceptions
    promptRole: hidden-inference
    valueType: array<object>
    description: 结构化误解台账 [{conceptKey, hypothesis, canonicalLabel, confidence(0|25|50|75|100 五档), evidence(学生原话), status}]；喂 misconception-ledger 生命周期
  - fieldId: analysis.ktEstimate
    promptRole: hidden-inference
    valueType: object
    description: 回合级知识状态估计（θ−d 路由信号）：conceptMastery[{conceptKey,kcId,mastery 0-1,evidence}] + currentTaskDifficulty 0-1 + recommendation(consolidate|advance|challenge|scaffold)
  - fieldId: analysis.selfAssessmentSignal
    promptRole: hidden-inference
    valueType: string
    description: 隐藏自评信号（enum high|medium|low；只从学生自然语言静默提取，无信号不输出；用于后台校准闭环）
  - fieldId: analysis.helpSeekingType
    promptRole: hidden-inference
    valueType: string
    description: 求助行为自由描述（工具性/执行性/回避性；无求助信号不输出；用于后台统计与拦截）
  - fieldId: analysis.rsmAttempts
    promptRole: hidden-inference
    valueType: array<object>
    description: PF（productiveFailure）模式下学生解法尝试台账 [{method,outcome(stuck|partial|wrong|success),evidence}]；非 PF 模式不输出
  - fieldId: knowledge.confirmCheck
    promptRole: derived-presentation
    valueType: object
    description: 知识点表态确认动作组 {prompt, actions[2]（正反两个下一步按钮）}；已有 checkpoint 客观验证时不输出
  - fieldId: control.warmupOutcomes
    promptRole: control-signal
    valueType: array<object>
    description: 课内温故逐点上报（硬契约：回捞了 planned 点必填）[{conceptKey|itemIndex, recall(unaided|with-hint|failed), evidence?}]；记忆引擎间隔与预算据此更新
  - fieldId: control.supplement
    promptRole: control-signal
    valueType: object
    description: 补充资料采集请求 {topic, query?}（每 session 至多一次；编排层采集后下一轮注入）
  - fieldId: diagram
    promptRole: derived-presentation
    valueType: object
    description: 课堂结构图（mermaid 源码，前端确定性渲染；结构类内容唯一图示通道，节点≤9、标签≤12 字）
  - fieldId: figure
    promptRole: derived-presentation
    valueType: object
    description: 位置线图（空间位置/距离/朝向/先后的确定性渲染；marks 1-6、spans≤3、数值坐标）
  - fieldId: knowledge.currentPoint
    promptRole: derived-presentation
    valueType: string
    description: 当前知识点
  - fieldId: knowledge.points
    promptRole: derived-presentation
    valueType: array<object>
    description: 本轮涉及的知识点状态列表
  - fieldId: pedagogy.strategies
    promptRole: hidden-inference
    valueType: array<string>
    description: 使用的教学策略
  - fieldId: control.isCompletionCandidate
    promptRole: control-signal
    valueType: boolean
    description: 是否触发 task 完成判定
  - fieldId: control.shouldTriggerPeer
    promptRole: control-signal
    valueType: boolean
    description: 是否触发伴学回合
  - fieldId: control.checkpoint
    promptRole: control-signal
    valueType: object
    description: 检查点（question/type/options/hint），间隔满足时可选输出
  - fieldId: control.completionCandidateEvidence
    promptRole: derived-presentation
    valueType: object
    description: 完成候选证据（**代码确定性合成**的观测信号，非 LLM 产出：验收词匹配评估结果透传；2026-08-30 起不参与完成门禁，仅用于与 LLM 语义判定比对收敛质量）

  # === skill:teaching-turn 输入通道（teaching-agent 编排注入） ===
  # pathInRawOutput 以回合装配源 { session, teachingState, context } 为根
  - fieldId: learner.learnerProjection
    promptRole: soft-info
    valueType: object
    pathInRawOutput: context.learnerProjection
    description: 学习者教学投影（toTeachingProjection）
  - fieldId: knowledge.state
    promptRole: soft-info
    valueType: object
    pathInRawOutput: session.knowledgeState
    description: 知识看板当前状态（points/currentPoint）
  - fieldId: controls.teachingControlContext
    promptRole: soft-info
    valueType: object
    pathInRawOutput: teachingState.teachingControlContext
    description: 教学控制上下文（priority/allow* 标志）
  - fieldId: classroomContext
    promptRole: soft-info
    valueType: object
    pathInRawOutput: teachingState.classroomContext
    description: 课堂上下文（上轮持久化）
  - fieldId: visibleDialogueContext
    promptRole: soft-info
    valueType: array<object>
    pathInRawOutput: session.messages
    description: 最近可见对话（role/content）

  # === skill:peer-reinforcement 产出 ===
  - fieldId: message
    promptRole: public-reply
    valueType: string
    description: 伴学补强的对话回复
  - fieldId: followUpQuestions
    promptRole: public-reply
    valueType: array<string>
    description: 伴学后续追问
  # 注：definition.ts outputSchema 另有 strategy（required）——那是编排层所选策略的**代码回显**
  # （core 提示词不要求模型输出该字段），不属 LLM 产出契约，故不在此声明。

  # === skill:session-wrapup 产出 ===
  - fieldId: summary.topicSummary
    promptRole: public-reply
    valueType: string
    description: 本次会话主题总结
  - fieldId: summary.knowledgeSummary
    promptRole: public-reply
    valueType: string
    description: 本次会话知识点总结
  - fieldId: summary.knowledgeItems
    promptRole: derived-presentation
    valueType: array<object>
    description: 本次会话知识点列表（name/status/progress/evidence）
  - fieldId: summary.learningEvaluation
    promptRole: public-reply
    valueType: string
    description: 学习评估文本
  - fieldId: summary.practiceAdvice
    promptRole: public-reply
    valueType: string
    description: 练习建议
  - fieldId: evaluation.sessionLss
    promptRole: hidden-inference
    valueType: object
    description: 本次会话 LSS 档位对象 {tier=low|mid|high, evidence}——提示词禁止输出 0-10 数字，档位→数值由平台按锚点区间中点（low=2.5/mid=6/high=9）统一映射（session-evaluation-scale 单源）
  - fieldId: evaluation.sessionKtl
    promptRole: hidden-inference
    valueType: object
    description: 本次会话 KTL 档位对象 {tier=low|mid|high, evidence}（low=反复卡住 / mid=引导下能推进 / high=独立完成核心任务）；数值由平台档位映射，非模型自报
  - fieldId: evaluation.sessionLf
    promptRole: hidden-inference
    valueType: object
    description: 本次会话 LF 档位对象 {tier=low|mid|high, evidence}（low=精力稳定 / mid=一定疲劳 / high=明显疲劳）；数值由平台档位映射，非模型自报
  - fieldId: evaluation.confidence
    promptRole: hidden-inference
    valueType: number
    description: 本次评估的置信度
  - fieldId: evaluation.reasoning
    promptRole: hidden-inference
    valueType: string
    description: 评估依据（引用 1-2 个关键证据）
  - fieldId: summary.keyTakeaways
    promptRole: public-reply
    valueType: array<string>
    description: 收获列表
  - fieldId: summary.actionPlan
    promptRole: public-reply
    valueType: array<string>
    description: 行动列表（含检索式自测）
  - fieldId: summary.evaluationHighlights
    promptRole: public-reply
    valueType: object
    description: 亮点与改进（strengths/improvements）
  - fieldId: summary.metricInterpretation
    promptRole: derived-presentation
    valueType: object
    description: 本节/长期指标解读
  - fieldId: summary.summaryVersion
    promptRole: derived-presentation
    valueType: string
    description: summary 结构版本（固定 v2）

routings:
  # teaching-turn 输出
  - agentId: skill:teaching-turn
    fieldId: reply
    render: visible
    handoff: [teaching-agent, skill:peer-reinforcement] # reply 原文同链交付伴学（tutorLatestReply）
    internal: false
    accumulate: false
  - agentId: skill:teaching-turn
    fieldId: analysis.levelScore
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: analysis.confusionPoints
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: analysis.engagement
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: analysis.emotionalState
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  # 2026-10-24 契约同步批：以下字段此前仅存在于提示词与代码消费端，补齐声明层
  - agentId: skill:teaching-turn
    fieldId: analysis.loadIndex
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 干预路由（认知负荷三路由）与课后 session_load 聚合消费
  - agentId: skill:teaching-turn
    fieldId: analysis.loadBasis
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: analysis.misconceptions
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 喂 misconception-ledger（suspected→confirmed→addressed 生命周期）
  - agentId: skill:teaching-turn
    fieldId: analysis.ktEstimate
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: θ−d 路由信号（难度感知路由）
  - agentId: skill:teaching-turn
    fieldId: analysis.selfAssessmentSignal
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 后台校准闭环（行为投影器）
  - agentId: skill:teaching-turn
    fieldId: analysis.helpSeekingType
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 求助拦截（反复直接索要答案不放宽产出要求）
  - agentId: skill:teaching-turn
    fieldId: analysis.rsmAttempts
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 仅 PF（productiveFailure）模式
  - agentId: skill:teaching-turn
    fieldId: knowledge.confirmCheck
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
  - agentId: skill:teaching-turn
    fieldId: control.warmupOutcomes
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    notes: 硬契约：回捞了 planned 点必报，漏报=记忆引擎收不到结果
  - agentId: skill:teaching-turn
    fieldId: control.supplement
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    notes: 每 session 至多一次；编排层采集后下一轮注入
  - agentId: skill:teaching-turn
    fieldId: diagram
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    notes: mermaid 前端确定性渲染（结构类图示唯一通道）
  - agentId: skill:teaching-turn
    fieldId: figure
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    notes: 位置线图（空间/序关系确定性渲染）
  # cognitiveLevel/understanding 同链交付 peer（peer-reinforcement 消费）
  - agentId: skill:teaching-turn
    fieldId: analysis.cognitiveLevel
    render: hidden
    handoff: [teaching-agent, skill:peer-reinforcement]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: analysis.understanding
    render: hidden
    handoff: [teaching-agent, skill:peer-reinforcement]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: knowledge.currentPoint
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
  - agentId: skill:teaching-turn
    fieldId: knowledge.points
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:teaching-turn
    fieldId: pedagogy.strategies
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:teaching-turn
    fieldId: control.isCompletionCandidate
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
  - agentId: skill:teaching-turn
    fieldId: control.shouldTriggerPeer
    render: visible
    handoff: [skill:peer-reinforcement, teaching-agent]
    internal: false
    accumulate: false
    notes: 触发 peer 流程的信号
  - agentId: skill:teaching-turn
    fieldId: control.checkpoint
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    notes: 可选输出：满足间隔时才产生
  - agentId: skill:teaching-turn
    fieldId: control.completionCandidateEvidence
    render: hidden
    handoff: [teaching-agent]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 编排层门禁内部证据，不面向前端

  # teaching-agent → skill:teaching-turn 输入通道（编排注入，非 LLM 产出）
  - agentId: teaching-agent
    fieldId: learner.learnerProjection
    render: hidden
    handoff: [skill:teaching-turn]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 回合输入通道（AITeachingOrchestrator 组装注入）
  - agentId: teaching-agent
    fieldId: knowledge.state
    render: hidden
    handoff: [skill:teaching-turn]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 回合输入通道（AITeachingOrchestrator 组装注入）
  - agentId: teaching-agent
    fieldId: controls.teachingControlContext
    render: hidden
    handoff: [skill:teaching-turn]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 回合输入通道（AITeachingOrchestrator 组装注入）
  - agentId: teaching-agent
    fieldId: classroomContext
    render: hidden
    handoff: [skill:teaching-turn]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 回合输入通道（AITeachingOrchestrator 组装注入）
  - agentId: teaching-agent
    fieldId: visibleDialogueContext
    render: hidden
    handoff: [skill:teaching-turn]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 回合输入通道（AITeachingOrchestrator 组装注入）

  # peer-reinforcement 输出
  - agentId: skill:peer-reinforcement
    fieldId: message
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
  - agentId: skill:peer-reinforcement
    fieldId: followUpQuestions
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: false
  # strategy（peer 输出里的代码回显）不路由：非 LLM 产出，见 fields 区注记

  # session-wrapup 输出
  - agentId: skill:session-wrapup
    fieldId: summary.topicSummary
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.knowledgeSummary
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.knowledgeItems
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.learningEvaluation
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.practiceAdvice
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.keyTakeaways
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.actionPlan
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.evaluationHighlights
    render: visible
    handoff: [teaching-agent]
    internal: false
    accumulate: true
  - agentId: skill:session-wrapup
    fieldId: summary.metricInterpretation
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: summary.summaryVersion
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: false
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: evaluation.sessionLss
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: evaluation.sessionKtl
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: evaluation.sessionLf
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: evaluation.confidence
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:session-wrapup
    fieldId: evaluation.reasoning
    render: hidden
    handoff: [teaching-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal

  # teaching-agent → learner（累积画像）
  - agentId: teaching-agent
    fieldId: analysis.understanding
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: analysis.confusionPoints
    render: hidden
    handoff: [profile]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: teaching-agent
    fieldId: knowledge.points
    render: hidden
    handoff: [profile]
