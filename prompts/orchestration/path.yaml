    internal: true
    accumulate: false
  - agentId: skill:kc-mapper
    fieldId: taskKcLinks
    render: hidden
    handoff: [path-agent]
    internal: true
    accumulate: false
  - agentId: skill:kc-mapper
    fieldId: kcGraph
    render: hidden
    handoff: [path-agent]
    internal: true
    accumulate: false
    notes: 物化概念图（prerequisite 闭包 → 教学侧前置缺口查询）
  - agentId: skill:kc-mapper
    fieldId: gapCoverage
    render: hidden
    handoff: [path-agent]
    internal: true
    accumulate: false
