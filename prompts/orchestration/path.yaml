    internal: true
    accumulate: false
  - agentId: skill:path-reviewer
    fieldId: issues
    render: hidden
    handoff: [path-agent]
    internal: true
    accumulate: false
  - agentId: skill:path-reviewer
    fieldId: passed
    render: hidden
    handoff: [path-agent]
    internal: true
    accumulate: false
  - agentId: skill:path-reviewer
    fieldId: replanInstructions
    render: hidden
    handoff: [path-agent, skill:path-planning]
    internal: true
    accumulate: false
    notes: 评审未过时的修订指令回传

  # === skill:kc-mapper（2026-10-24 契约同步批；代码侧物化为概念图/KC 注册表） ===
