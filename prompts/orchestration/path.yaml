    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.subtaskMinutesRange
    render: hidden
    handoff: [skill:path-planning, skill:path-task-design]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.maxWeeks
    render: hidden
    handoff: [skill:path-planning, skill:path-task-design]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: previousMilestone
    render: hidden
    handoff: [skill:path-task-design]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: loopOver 编排注入（前一 milestone 上下文），非 LLM 输出

  # path-planning → path-task-design + path-agent
  - agentId: skill:path-planning
    fieldId: path.id
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.name
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.summary
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.totalMilestones
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  # cognitiveCore 同时供 path-task-design（learning.service stageDesignerBaseInput）
  - agentId: skill:path-planning
    fieldId: cognitiveCore.cognitiveDomain
    render: visible
    handoff: [path-agent, skill:path-task-design, skill:path-kc-mapping]
    internal: false
    accumulate: true
  - agentId: skill:path-planning
    fieldId: cognitiveCore.coreConcepts
    render: visible
    handoff: [path-agent, skill:path-task-design, skill:path-kc-mapping]
    internal: false
    accumulate: true
  - agentId: skill:path-planning
    fieldId: milestones.stageNumber
    render: visible
    handoff: [skill:path-task-design, path-agent, skill:path-kc-mapping, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.title
    render: visible
    handoff: [skill:path-task-design, path-agent, skill:path-kc-mapping, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.coreConcept
    render: visible
    handoff: [skill:path-task-design, path-agent, skill:path-kc-mapping, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.goal
    render: visible
    handoff: [skill:path-task-design, path-agent, skill:path-kc-mapping, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.estimatedHours
    render: visible
    handoff: [skill:path-task-design, path-agent, skill:path-kc-mapping, skill:path-reviewer]
    internal: false
    accumulate: false

  # path-task-design → path-agent
  - agentId: skill:path-task-design
    fieldId: subtasks.title
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.type
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.estimatedMinutes
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.acceptanceCriteria
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.linkedConcept
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.knowledgeType
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-task-design
    fieldId: subtasks.cognitiveLevel
    render: visible
    handoff: [path-agent]
    internal: false
