  - agentId: skill:path-task-design
    fieldId: subtasks.transferable
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  # 2026-10-24 契约同步批：补齐该产出者块缺失的三项
  - agentId: skill:path-task-design
    fieldId: subtasks.icapLevel
    render: visible
    handoff: [path-agent]
    internal: false
