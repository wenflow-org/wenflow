# Path 阶段编排文件（字段路由单源化）
# 由字段路由 seed TS 机械迁移（1:1）；seed TS 已退役，本文件为唯一声明源。

stage: path
order: 2
displayName: Path 阶段
description: 学习路径生成：Framing → Path Planning → Stage Designer → Path Reviewer → KC Mapper

contracts:
  - agentId: skill:path-planning
  - agentId: skill:stage-designer
  - agentId: skill:path-reviewer
  - agentId: skill:kc-mapper
  - agentId: path-agent

fields:
  # === path-agent 确定性定帧产出 normalizedInput.*（原 skill:path-scene-framing） ===
  - fieldId: normalizedInput.learnerProfile.backgroundExperience
    promptRole: soft-info
    valueType: string
    description: 学习者背景经验（清洗）
  - fieldId: normalizedInput.learnerProfile.constraintsAndBoundaries
    promptRole: soft-info
    valueType: string
    description: 学习者约束与边界（清洗）
  - fieldId: normalizedInput.problemSpace.realProblem
    promptRole: hard-required
    valueType: string
    description: 真实问题（清洗）
    systemLocked: true
  - fieldId: normalizedInput.problemSpace.scenario
    promptRole: soft-info
    valueType: string
    description: 学习场景（清洗）
  - fieldId: normalizedInput.problemSpace.currentPainPoint
    promptRole: soft-info
    valueType: string
    description: 当前痛点（清洗）
  - fieldId: normalizedInput.resources.timeBudget
    promptRole: hard-required
    valueType: string
    description: 时间预算
    systemLocked: true
  - fieldId: normalizedInput.resources.timeBudgetCadence
    promptRole: soft-info
    valueType: string
    description: 时间预算节奏
  - fieldId: normalizedInput.successCriteria.observableResult
    promptRole: hard-required
    valueType: string
    description: 可观察结果
    systemLocked: true
  - fieldId: normalizedInput.confirmedProposal.firstDeliverable
    promptRole: proposal-output
    valueType: string
    description: 确认的第一交付物
  - fieldId: normalizedInput.confirmedProposal.keyStages
    promptRole: proposal-output
    valueType: string
    description: 确认的关键阶段
  - fieldId: normalizedInput.planningHints.paceSignal
    promptRole: hidden-inference
    valueType: string
    description: 推断的学习节奏信号
  - fieldId: normalizedInput.planningHints.milestoneRange
    promptRole: hidden-inference
    valueType: string
    description: 推断的 milestone 数量范围
  - fieldId: normalizedInput.planningHints.conceptRange
    promptRole: hidden-inference
    valueType: string
    description: 推断的 concept 数量范围
  - fieldId: normalizedInput.planningHints.subtasksPerStageRange
    promptRole: hidden-inference
    valueType: string
    description: 推断的每阶段 subtask 数量范围
  - fieldId: normalizedInput.planningHints.subtaskMinutesRange
    promptRole: hidden-inference
    valueType: string
    description: 推断的 subtask 分钟数范围
  - fieldId: normalizedInput.planningHints.maxWeeks
    promptRole: hidden-inference
    valueType: number
    description: 推断的最大周数
  # === path-agent 编排注入（loopOver 上下文，非 LLM 产出） ===
  - fieldId: previousMilestone
    promptRole: derived-presentation
    valueType: object
    pathInRawOutput: previousMilestone
    description: 前一里程碑上下文（title/coreConcept），consolidate 回捞输入；首阶段不注入

  # === skill:path-planning 产出 ===
  - fieldId: path.id
    promptRole: control-signal
    valueType: string
    description: 路径 ID
    systemLocked: true
  - fieldId: path.name
    promptRole: public-reply
    valueType: string
    description: 路径名称
  - fieldId: path.summary
    promptRole: public-reply
    valueType: string
    description: 路径摘要
  - fieldId: path.totalMilestones
    promptRole: derived-presentation
    valueType: number
    description: milestone 总数
  - fieldId: cognitiveCore.cognitiveDomain
    promptRole: soft-info
    valueType: string
    description: 认知领域归类
  - fieldId: cognitiveCore.coreConcepts
    promptRole: soft-info
    valueType: array<object>
    description: 核心概念列表
  - fieldId: milestones.stageNumber
    promptRole: hard-required
    valueType: number
    description: 阶段编号
    systemLocked: true
  - fieldId: milestones.title
    promptRole: hard-required
    valueType: string
    description: 阶段标题
    systemLocked: true
  - fieldId: milestones.coreConcept
    promptRole: soft-info
    valueType: string
    description: 阶段核心概念
  - fieldId: milestones.goal
    promptRole: hard-required
    valueType: string
    description: 阶段目标
  - fieldId: milestones.estimatedHours
    promptRole: soft-info
    valueType: number
    description: 阶段估时（小时）

  # === skill:stage-designer 产出 ===
  - fieldId: subtasks.title
    promptRole: hard-required
    valueType: string
    description: 子任务标题
    systemLocked: true
  - fieldId: subtasks.type
    promptRole: soft-info
    valueType: string
    description: 子任务类型（acquire / deconstruct / model / execute / diagnose / refine / consolidate）
  - fieldId: subtasks.estimatedMinutes
    promptRole: soft-info
    valueType: number
    description: 子任务估时（分钟）
  - fieldId: subtasks.description
    promptRole: soft-info
    valueType: string
    description: 任务大概内容（围绕什么概念、在什么场景观察或练习）
  - fieldId: subtasks.acceptanceCriteria
    promptRole: soft-info
    valueType: string
    persistKey: acceptanceHint
    description: 验收标准（skill 实际产出键为 acceptanceHint，落库时映射为 subtasks.acceptanceCriteria）
  - fieldId: subtasks.linkedConcept
    promptRole: soft-info
    valueType: string
    description: 关联的认知概念
  - fieldId: subtasks.knowledgeType
    promptRole: soft-info
    valueType: string
    description: 知识类型（factual / conceptual / procedural / metacognitive）
  - fieldId: subtasks.cognitiveLevel
    promptRole: soft-info
    valueType: string
    description: 认知层次（Bloom 等级）
  - fieldId: subtasks.icapLevel
    promptRole: soft-info
    valueType: string
    description: ICAP 参与层级（passive / active / constructive / interactive），落 subtasks.icapLevel
  - fieldId: subtasks.transferable
    promptRole: soft-info
    valueType: boolean
    description: 是否可迁移
  - fieldId: subtasks.materialRefs
    promptRole: soft-info
    valueType: array<object>
    description: 任务→资料条目引用（逐字核对后保留的才落库；无资料时不出该键）

  # === skill:stage-designer 产出归属注记（2026-10-24 契约同步批） ===
  # path-planning 仅产出阶段骨架（milestones 不含 subtask）；subtasks.* 的实际逐阶段产出者是
  # stage-designer，路由归属见 routings 中既有「stage-designer → path-agent」块
  # （本批补齐该块缺的 icapLevel/description/materialRefs 三项）。

  # === skill:path-reviewer 产出（CIDDP 质量评审；2026-10-24 契约同步批补齐） ===
  - fieldId: score
    promptRole: control-signal
    valueType: number
    description: CIDDP 综合评分 0-1（五维度加权平均；低于 0.75 阈值触发重规划）
  - fieldId: dimensions
    promptRole: hidden-inference
    valueType: object
    description: 五维度分项评分（Clarity/Integrity/Depth/Practicality/Pertinence，各 0-1）
  - fieldId: issues
    promptRole: hidden-inference
    valueType: array<object>
    description: 评审问题清单（带维度与位置定位）
  - fieldId: passed
    promptRole: control-signal
    valueType: boolean
    description: 是否通过评审（编排层据此决定采纳或触发 path-planning 修订）
  - fieldId: replanInstructions
    promptRole: control-signal
    valueType: string
    description: 低于阈值时的重规划指令（回传 path-planning 的修订依据）

  # === skill:kc-mapper 产出（知识组件标注；2026-10-24 契约同步批补齐） ===
  - fieldId: conceptKcs
    promptRole: hidden-inference
    valueType: array<object>
    description: 概念级 KC 分解 [{conceptId, kcs[{kcId, name, taxonomy(factual|conceptual|procedural|metacognitive), prerequisiteKCs}]}]；每个 coreConcept 2-5 个 KC
  - fieldId: taskKcLinks
    promptRole: hidden-inference
    valueType: array<object>
    description: 任务↔KC 关联 [{taskTitle, linkedKCs[]}]（字段名逐字契约，代码侧另有别名归一兜底）；每个 subtask 至少关联 1 个 KC
  - fieldId: kcGraph
    promptRole: hidden-inference
    valueType: object
    description: KC 前置依赖图 {nodes[{kcId,name,taxonomy}], edges[{from,to,relation=prerequisite}]}（知识依赖非讲授顺序、无环）；代码侧物化为概念图供前置闭包查询
  - fieldId: gapCoverage
    promptRole: hidden-inference
    valueType: object
    description: 前提缺口覆盖报告 {covered[], uncovered[{concept,reason}]}（仅提供 prerequisiteTree 时输出，否则整个字段省略）

routings:
  # path-agent（确定性定帧）→ path-planning + stage-designer
  - agentId: path-agent
    fieldId: normalizedInput.learnerProfile.backgroundExperience
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.learnerProfile.constraintsAndBoundaries
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.problemSpace.realProblem
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.problemSpace.scenario
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.problemSpace.currentPainPoint
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.resources.timeBudget
    render: hidden
