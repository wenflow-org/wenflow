    internal: false
    accumulate: false
  # cognitiveCore 同时供 stage-designer（learning.service stageDesignerBaseInput）
  - agentId: skill:path-planning
    fieldId: cognitiveCore.cognitiveDomain
    render: visible
    handoff: [path-agent, skill:stage-designer]
    internal: false
    accumulate: true
  - agentId: skill:path-planning
