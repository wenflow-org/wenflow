  - agentId: path-agent
    fieldId: normalizedInput.confirmedProposal.firstDeliverable
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.confirmedProposal.keyStages
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.paceSignal
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.milestoneRange
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.conceptRange
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.subtasksPerStageRange
    render: hidden
    handoff: [skill:path-planning, skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: 确定性定帧产出（buildFramedNormalizedInput），非 LLM 输出
  - agentId: path-agent
    fieldId: normalizedInput.planningHints.subtaskMinutesRange
    render: hidden
