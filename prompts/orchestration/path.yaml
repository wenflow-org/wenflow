    render: hidden
    handoff: [skill:stage-designer]
    internal: true
    accumulate: false
    visibilityPreset: agent-internal
    notes: loopOver 编排注入（前一 milestone 上下文），非 LLM 输出

  # path-planning → stage-designer + path-agent
  - agentId: skill:path-planning
    fieldId: path.id
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.name
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.summary
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: path.totalMilestones
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  # cognitiveCore 同时供 stage-designer（learning.service stageDesignerBaseInput）
  - agentId: skill:path-planning
    fieldId: cognitiveCore.cognitiveDomain
    render: visible
    handoff: [path-agent, skill:stage-designer, skill:kc-mapper]
    internal: false
    accumulate: true
  - agentId: skill:path-planning
    fieldId: cognitiveCore.coreConcepts
    render: visible
    handoff: [path-agent, skill:stage-designer, skill:kc-mapper]
    internal: false
    accumulate: true
  - agentId: skill:path-planning
    fieldId: milestones.stageNumber
    render: visible
    handoff: [skill:stage-designer, path-agent, skill:kc-mapper, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.title
    render: visible
    handoff: [skill:stage-designer, path-agent, skill:kc-mapper, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.coreConcept
    render: visible
    handoff: [skill:stage-designer, path-agent, skill:kc-mapper, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.goal
    render: visible
    handoff: [skill:stage-designer, path-agent, skill:kc-mapper, skill:path-reviewer]
    internal: false
    accumulate: false
  - agentId: skill:path-planning
    fieldId: milestones.estimatedHours
    render: visible
    handoff: [skill:stage-designer, path-agent, skill:kc-mapper, skill:path-reviewer]
    internal: false
    accumulate: false

  # stage-designer → path-agent
  - agentId: skill:stage-designer
    fieldId: subtasks.title
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.type
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.estimatedMinutes
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.acceptanceCriteria
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.linkedConcept
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.knowledgeType
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.cognitiveLevel
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.transferable
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  # 2026-10-24 契约同步批：补齐该产出者块缺失的三项
  - agentId: skill:stage-designer
    fieldId: subtasks.icapLevel
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
    notes: ICAP 非递减约束（active→constructive→interactive）
  - agentId: skill:stage-designer
    fieldId: subtasks.description
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
  - agentId: skill:stage-designer
    fieldId: subtasks.materialRefs
    render: visible
    handoff: [path-agent]
    internal: false
    accumulate: false
    notes: 逐字核对不过的引用会被代码丢弃

  # path-agent → learning（聚合 handoff）
  - agentId: path-agent
    fieldId: path.name
    render: visible
    handoff: [teaching]
    internal: false
    accumulate: false
  - agentId: path-agent
    fieldId: path.summary
