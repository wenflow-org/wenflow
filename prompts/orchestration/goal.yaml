# Goal 阶段编排文件（字段路由单源化）
# 由字段路由 seed TS 机械迁移（1:1）；seed TS 已退役，本文件为唯一声明源。
#
# contracts.displayName/description 仍由 agent-manifest 派生（yaml 只声明 agentId）。

stage: goal
order: 1
displayName: Goal 阶段
description: 目标对话：澄清目标、收集背景、收敛到方向方案

contracts:
  - agentId: skill:goal-conversation
  - agentId: goal-agent

fields:
  # === skill:goal-conversation 产出 ===
  # hard-required
  - fieldId: understanding.surface_goal
    promptRole: hard-required
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.surface_goal
    snakeName: surface_goal
    camelName: surfaceGoal
    persistKey: surfaceGoal
    description: 用户最初表述的"想学什么"原话
    systemLocked: true
  - fieldId: understanding.real_problem
    promptRole: hard-required
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.real_problem
    description: 深层真实问题（回溯后收敛）
    systemLocked: true
  - fieldId: understanding.available_resources.time_budget
    promptRole: hard-required
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.available_resources.time_budget
    description: 时间预算（几周/几月）
    systemLocked: true
  - fieldId: understanding.available_resources.time_horizon
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.available_resources.time_horizon
    description: 时间视角（紧迫 vs 从容）
  - fieldId: understanding.success_criteria.observable_result
    promptRole: hard-required
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.success_criteria.observable_result
    description: 学习成功的可观察结果
    systemLocked: true
  # soft-info
  - fieldId: understanding.current_baseline.level
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.current_baseline.level
    description: 当前水平（enum beginner|intermediate|advanced|unknown 契约值；无法判断一律 unknown，不默认 beginner）
  - fieldId: understanding.current_baseline.evidence
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.current_baseline.evidence
    description: 当前水平的证据
  - fieldId: understanding.success_criteria.acceptance_check
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.success_criteria.acceptance_check
    description: 验收检查方法
  - fieldId: understanding.available_resources.time_per_session
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.available_resources.time_per_session
    description: 每次学习时长
  - fieldId: understanding.constraints_and_boundaries
    promptRole: soft-info
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.understanding.constraints_and_boundaries
    description: 约束与边界
    bindings:
      accumulate: true
  - fieldId: understanding.pain_points
    promptRole: soft-info
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.understanding.pain_points
    description: 当前痛点
  - fieldId: understanding.motivation
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.motivation
    description: 学习动机
  - fieldId: understanding.urgency
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.urgency
    description: 紧急程度
  - fieldId: understanding.scenario
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.scenario
    description: 学习场景
  - fieldId: understanding.deadline_text
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.deadline_text
    description: 截止日期文本
  - fieldId: understanding.deadline_date
    promptRole: soft-info
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.deadline_date
    description: 外部截止绝对日期（YYYY-MM-DD；考试/报名等高可信日历锚，排程一级输入，宁缺勿错、相对表述留空）
  - fieldId: understanding.time_dimensions
    promptRole: hidden-inference
    valueType: object
    pathInRawOutput: internal.ext.goalConversation.understanding.time_dimensions
    description: 时间维度数值推断（camel 化为 timeDimensions 透传 path 层，planningHints 容量推导主输入）＝{totalSessions 总课次(可小数), sessionsLengthMin 每次分钟, totalWeeks 周数, sessionsPerWeek 每周次数, estimatedHours 总小时}；无依据字段给 null 禁止编造；课次<1 ⇒ 一次性操作不排课
  # hidden-inference
  - fieldId: understanding.background_experience
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.background_experience
    description: 背景经验推断（prompt 明确不展示给前端）
  - fieldId: understanding.goal_orientation
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.goal_orientation
    description: 目标取向（掌握型/表现型等自由描述，hidden，静默累积，不主动追问）
  - fieldId: understanding.learning_signal
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.learning_signal
    description: 学习信号（隐式推断）
  - fieldId: understanding.cognitive_bandwidth
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.cognitive_bandwidth
    description: 认知带宽推断（可选 hidden，core yaml 已声明）
  # 2026-10-24 契约同步批：以下分诊/结构化字段此前仅存在于提示词与消费端，补齐声明层
  - fieldId: understanding.primary_block_type
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.primary_block_type
    description: 主阻塞类型诊断（enum capability|oneoff_operation|environment_tooling|permission_process|emotion_relationship；达到诊断门槛才填，证据不足整体留空；影响平台分诊与路径体量）
  - fieldId: understanding.recurrence
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.recurrence
    description: 主阻塞是否反复发生（enum oneoff|recurring；与 primary_block_type 同门槛同留空规则）——triage 分流钥匙（transferable×recurrence）
  - fieldId: understanding.block_type_evidence
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.block_type_evidence
    description: primary_block_type 的一句支撑证据（优先保留用户原话关键词）
  - fieldId: understanding.support_need
    promptRole: hidden-inference
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.understanding.support_need
    description: 学习之外的支持需求（enum none|emotional|referral；与 primary_block_type 独立可并存，证据不足取 none）
  - fieldId: understanding.school_anchor
    promptRole: hidden-inference
    valueType: object
    pathInRawOutput: internal.ext.goalConversation.understanding.school_anchor
    description: 校内体系锚 {textbook 教材版本, examScope 考试形式, schoolPace 在校进度}；身处教材/考试体系才填，至少一项有值，无依据整体留空（教学侧 pathBackgroundContext.schoolAnchor 消费）
  - fieldId: understanding.prerequisiteDiagnostics
    promptRole: soft-info
    valueType: array<object>
    pathInRawOutput: internal.ext.goalConversation.understanding.prerequisiteDiagnostics
    description: 前置知识探测题（最多 2 个二元单概念点）[{probeId, targetConcept, question, options[2], correctOption}]；作答结果由平台回传校准 prerequisiteTree.knownConcepts
  - fieldId: understanding.prerequisiteCheckResults
    promptRole: soft-info
    valueType: array<object>
    pathInRawOutput: internal.ext.goalConversation.understanding.prerequisiteCheckResults
    description: 探测题作答结果（用户作答后回填）[{probeId, targetConcept, userAnswer, isCorrect}]
  - fieldId: proposalQuality
    promptRole: hidden-inference
    valueType: object
    pathInRawOutput: internal.ext.goalConversation.proposalQuality
    description: 提案 SMART 自评（proposing 阶段随 confirmedProposal 产出）{specific, measurable, achievable, relevant, timeBound 均 0-100, overall 加权总分}；overall<60 时回复给一句质量改善建议但不阻断确认
  # 平台派生/旁路字段
  - fieldId: structuredData
    promptRole: soft-info
    valueType: object
    pathInRawOutput: internal.ext.goalConversation.structuredData
    description: 结构化画像旁路字段（learner.identity/learning_context 等）
  # proposal-output
  - fieldId: confirmedProposal.learning_direction
    promptRole: proposal-output
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.confirmedProposal.learning_direction
    description: 确认的学习方向
  - fieldId: confirmedProposal.first_deliverable
    promptRole: proposal-output
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.confirmedProposal.first_deliverable
    description: 第一个交付物
  - fieldId: confirmedProposal.key_stages
    promptRole: proposal-output
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.confirmedProposal.key_stages
    description: 关键阶段
  - fieldId: confirmedProposal.out_of_scope
    promptRole: proposal-output
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.confirmedProposal.out_of_scope
    description: 不在此次学习的范围
  - fieldId: confirmedProposal.scope_size
    promptRole: proposal-output
    valueType: string
    pathInRawOutput: internal.ext.goalConversation.confirmedProposal.scope_size
    description: 问题规模的自由判断与依据（一句话；**不选档位**——micro/small 等标签口径已废弃，下游 path 层仅作参考输入，阶段数由路径生成侧按实际复杂度决定）
  # public-reply
  - fieldId: userVisible
    promptRole: public-reply
    valueType: string
    pathInRawOutput: userVisible
    description: 给用户看的内容（适合 LLM 聊天 UI）
  - fieldId: goalConversation.nextQuestions
    promptRole: public-reply
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.nextQuestions
    description: 下一轮建议问题
  - fieldId: goalConversation.quickReplies
    promptRole: public-reply
    valueType: array<string>
    pathInRawOutput: internal.ext.goalConversation.quickReplies
    description: 快捷回复选项
  # control-signal
  - fieldId: core.conversationId
    promptRole: control-signal
    valueType: string
    pathInRawOutput: internal.core.conversationId
    description: 对话 ID
  - fieldId: core.stage
    promptRole: control-signal
    valueType: string
    pathInRawOutput: internal.core.stage
    description: 对话阶段
  - fieldId: core.confidence
    promptRole: control-signal
    valueType: number
    pathInRawOutput: internal.core.confidence
    description: 收敛置信度
  - fieldId: core.isCompleted
    promptRole: control-signal
    valueType: boolean
    pathInRawOutput: internal.core.isCompleted
    description: 对话是否完成
  - fieldId: confidenceScores
    promptRole: control-signal
    valueType: object
    pathInRawOutput: internal.ext.goalConversation.confidenceScores
    description: 分项置信度评分（每轮产出）

