    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: true
  - agentId: skill:goal-conversation
    fieldId: understanding.pain_points
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: true
  - agentId: skill:goal-conversation
    fieldId: understanding.motivation
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: true
  - agentId: skill:goal-conversation
    fieldId: understanding.urgency
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: understanding.scenario
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: understanding.deadline_text
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  # hidden-inference: hidden, handoff to goal-agent, accumulate to learner model
  - agentId: skill:goal-conversation
    fieldId: understanding.background_experience
    render: hidden
    handoff: [goal-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:goal-conversation
    fieldId: understanding.learning_signal
    render: hidden
    handoff: [goal-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:goal-conversation
    fieldId: understanding.cognitive_bandwidth
    render: hidden
    handoff: [goal-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  # 平台派生/旁路字段
  - agentId: skill:goal-conversation
    fieldId: structuredData
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
    visibilityPreset: agent-internal
  # proposal-output: visible, handoff to goal-agent
  - agentId: skill:goal-conversation
    fieldId: confirmedProposal.learning_direction
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: confirmedProposal.first_deliverable
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: confirmedProposal.key_stages
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: confirmedProposal.out_of_scope
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  # public-reply: visible, no handoff (stays in goal conversation)
  - agentId: skill:goal-conversation
    fieldId: userVisible
    render: visible
    handoff: []
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: goalConversation.nextQuestions
    render: visible
    handoff: []
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: goalConversation.quickReplies
    render: visible
    handoff: []
    internal: false
    accumulate: false
  # control-signal
  - agentId: skill:goal-conversation
    fieldId: core.conversationId
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: core.stage
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: core.confidence
    render: visible
    handoff: []
    internal: true
    accumulate: false
    notes: internal — 仅作 UI 进度条
  - agentId: skill:goal-conversation
    fieldId: core.isCompleted
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
  - agentId: skill:goal-conversation
    fieldId: confidenceScores
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false

  # === goal-agent 桥接路由：接收并转交到 path ===
  - agentId: goal-agent
    fieldId: understanding.surface_goal
    render: visible
    handoff: [path]
    internal: false
    accumulate: false
  - agentId: goal-agent
    fieldId: understanding.real_problem
    render: visible
    handoff: [path]
    internal: false
    accumulate: false
    notes: path description 的最终兜底
  - agentId: goal-agent
    fieldId: understanding.background_experience
    render: hidden
