  # === skill:goal-conversation 产出的字段 ===
  # hard-required: visible, handoff to goal-agent
  - agentId: skill:goal-conversation
    fieldId: understanding.surface_goal
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: true
    visibilityPreset: user-clarification
  - agentId: skill:goal-conversation
    fieldId: understanding.real_problem
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: true
    visibilityPreset: user-clarification
  - agentId: skill:goal-conversation
    fieldId: understanding.available_resources.time_budget
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
    visibilityPreset: user-clarification
  - agentId: skill:goal-conversation
    fieldId: understanding.success_criteria.observable_result
    render: visible
    handoff: [goal-agent]
    internal: false
    accumulate: false
    visibilityPreset: user-clarification
  # soft-info: visible or hidden based on sensitivity
  - agentId: skill:goal-conversation
