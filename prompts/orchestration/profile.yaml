# Profile 阶段编排文件（字段路由单源化）
# 由字段路由 seed TS 机械迁移（1:1）；seed TS 已退役，本文件为唯一声明源。
#
# profile 阶段字段**绝大多数**为编排器内部沉淀（写入 learnerModel），
# 所以 render 默认 hidden, accumulate=true, internal 多为 false
# （因为 snapshot/projection 会读，不是 skill 私有）。
# 例外（2026-10-14）：skill:adaptive-guidance-copy 的 8 个产出是**学习者可见**的页面文案
# （render: visible + public-reply），因该技能本身归画像阶段而随迁入本文件——
# 见下方「产出」注释块；下表合计 33 个字段中 25 hidden / 8 visible。

stage: profile
order: 4
displayName: 画像阶段
description: 学习者画像增强与背景知识沉淀，以及面向学习者的引导文案生成

contracts:
  - agentId: skill:lesson-knowledge-enricher
  - agentId: skill:learner-model
  - agentId: skill:learning-predictor
  - agentId: skill:adaptive-guidance-copy
  - agentId: profile-agent

fields:
  # === skill:lesson-knowledge-enricher 产出（承接已退役 distiller） ===
  - fieldId: conceptLedger
    promptRole: derived-presentation
    valueType: array<object>
    persistKey: knowledgeMemory.globalBackground.conceptLedger
    description: 概念账本（key/label/familiarity/transferReadiness/...，落库于画像 3 层 JSON 之下）
  - fieldId: reusableFoundations
    promptRole: derived-presentation
    valueType: array<string>
    description: 可复用的基础知识 key 列表
  - fieldId: blockedFoundations
    promptRole: derived-presentation
    valueType: array<string>
    description: 阻碍后续学习的基础知识 key 列表
  - fieldId: transferSignals
    promptRole: derived-presentation
    valueType: array<object>
    description: 可迁移信号（conceptKey/label/readiness/confidence）
  - fieldId: recurringConfusions
    promptRole: hidden-inference
    valueType: array<object>
    description: 反复出现的困惑点（concept/evidence/confidence）
  - fieldId: knowledgeStateSummary
    promptRole: derived-presentation
    valueType: string
    description: 本节课后知识状态自然语言摘要（LBM 式，供学习表现预测器与教学决策读取）

  # === skill:learner-model 聚合产出（确定性 snapshot 结构） ===
  - fieldId: snapshot.dynamicState
    promptRole: derived-presentation
    valueType: object
    description: 动态学习状态（metrics/趋势/推荐节奏）
  - fieldId: snapshot.learningControlState
    promptRole: derived-presentation
    valueType: object
    description: 学习控制态（paceMode/conceptLoad/reviewPriority/...）
  - fieldId: snapshot.replanSignal
    promptRole: derived-presentation
    valueType: object
    description: 重调信号（shouldSuggest/priority/recommendation）
  - fieldId: snapshot.teachingHints
    promptRole: derived-presentation
    valueType: object
    description: 教学提示（teaching 直接消费）
  - fieldId: snapshot.knowledgeMemory.currentPath
    promptRole: derived-presentation
    valueType: object
    description: 路径级知识记忆（progress/taskMastery/conceptStates）
  - fieldId: snapshot.knowledgeMemory.globalSignals
    promptRole: derived-presentation
    valueType: object
    description: 全局知识信号（mastered/fragile/struggling 概念）
  - fieldId: profile.curriculumControls
    promptRole: derived-presentation
    valueType: object
    description: 课程控制（taskGranularity/conceptDensity/reviewFrequency）

  # === skill:adaptive-guidance-copy 产出（2026-10-14 由 teaching 阶段随技能迁入） ===
  # 学习者可见的页面文案：dashboard / path-list / path-detail / learning-state 首屏投影
  - fieldId: headline
    promptRole: public-reply
    valueType: string
    description: 引导文案主标题
  - fieldId: subtitle
    promptRole: public-reply
    valueType: string
    description: 引导文案副标题
  - fieldId: todayActions
    promptRole: public-reply
    valueType: array<object>
    description: 今日行动列表（label/to）
  - fieldId: nextStep
    promptRole: public-reply
    valueType: string
    description: 下一步建议
  - fieldId: pathHint
    promptRole: public-reply
    valueType: string
    description: 路径相关提示
  - fieldId: paceHint
    promptRole: public-reply
    valueType: string
    description: 节奏相关提示
  - fieldId: emptyStateCopy
    promptRole: public-reply
    valueType: string
    description: 空态文案
  - fieldId: warningCopy
    promptRole: public-reply
    valueType: string
    description: 预警文案

routings:
  # lesson-knowledge-enricher → profile-agent（knowledgeBackground 聚合）
  - agentId: skill:lesson-knowledge-enricher
    fieldId: conceptLedger
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:lesson-knowledge-enricher
    fieldId: reusableFoundations
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:lesson-knowledge-enricher
    fieldId: blockedFoundations
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:lesson-knowledge-enricher
    fieldId: transferSignals
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:lesson-knowledge-enricher
    fieldId: recurringConfusions
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
  - agentId: skill:lesson-knowledge-enricher
    fieldId: knowledgeStateSummary
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: false
    visibilityPreset: agent-internal

  # learner-model → profile-agent（聚合产出，终点消费）
  - agentId: skill:learner-model
    fieldId: snapshot.dynamicState
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: snapshot.learningControlState
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: snapshot.replanSignal
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: snapshot.teachingHints
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: snapshot.knowledgeMemory.currentPath
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: snapshot.knowledgeMemory.globalSignals
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出
  - agentId: skill:learner-model
    fieldId: profile.curriculumControls
    render: hidden
    handoff: [profile-agent]
    internal: false
    accumulate: true
    visibilityPreset: agent-internal
    notes: 确定性聚合产出（ProfileAggregator/snapshot 装配），非 LLM 输出

  # profile-agent 聚合（不再 handoff，是终点；触发 snapshot/projection 刷新）
  - agentId: profile-agent
    fieldId: conceptLedger
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: reusableFoundations
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: blockedFoundations
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: transferSignals
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: recurringConfusions
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.dynamicState
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.learningControlState
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.replanSignal
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.teachingHints
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.knowledgeMemory.currentPath
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: snapshot.knowledgeMemory.globalSignals
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection
  - agentId: profile-agent
    fieldId: profile.curriculumControls
    render: hidden
    handoff: []
    internal: true
    accumulate: true
    visibilityPreset: agent-internal
    notes: learner 画像终点，写入 snapshot 与 projection

  # adaptive-guidance-copy 输出（2026-10-14 随技能由 teaching 阶段迁入）
  # handoff 由 [teaching-agent] 改为 [profile-agent]：本阶段内交付（原值会让编排图画出
  # profile → teaching 的倒流箭头，阶段序是 3 teaching → 4 profile）。
  - agentId: skill:adaptive-guidance-copy
    fieldId: headline
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: subtitle
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: todayActions
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: nextStep
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: pathHint
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: paceHint
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: emptyStateCopy
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
  - agentId: skill:adaptive-guidance-copy
    fieldId: warningCopy
    render: visible
    handoff: [profile-agent]
    internal: false
    accumulate: false
