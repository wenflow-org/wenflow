  # === actor-auditor（与 referee 共享 fieldId，词汇统一批次） ===
  - agentId: skill:virtual-learner-actor-auditor
    fieldId: verdict
    render: visible
    handoff: [simulation-agent]
    internal: false
    accumulate: false
  - agentId: skill:virtual-learner-actor-auditor
    fieldId: scores
    render: visible
    handoff: [simulation-agent]
    internal: false
