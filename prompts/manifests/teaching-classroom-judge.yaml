version: prompt-lab-manifest/v1
skillId: teaching-classroom-judge
agentId: skill:teaching-classroom-judge

name: default-skill-teaching-classroom-judge
archetype: extractor
description: 课堂级独立 LLM 评审——单节课逐轮记录 + 板书/图文载荷 + 收束产出的结构化病历单

acceptableAgentIds:
  - skill:teaching-classroom-judge
  - skill:classroom-quality-judge

publish:
  enabled: true
  exportTargets:
    - platform-prompts

promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: extraction
  interactionMode: batch
  input: { transport: json, schemaSource: skill-definition }
  output: { media: json, schemaSource: runtime-validator, envelope: adapter }
  context: { envelope: context-envelope/v1, delivery: sidecar }
  failurePolicy: retry

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState:
    domain: classroom-quality-review
    phases: [reviewed]
    defaultPhase: reviewed
    terminalPhases: [reviewed]
    statusValues: [succeeded, partial, blocked, failed]
  contextUpdate: { mode: none, stateOwner: none }
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - core-skill
  - extractor
  - handler-only
