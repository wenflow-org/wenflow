services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - wenflow_data:/app/data
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - SYSTEM_DATABASE_URL=file:/app/data/system.db
      - NODE_ENV=production
      - TRUST_PROXY=1
      - ADMIN_LOCALHOST_ONLY=false
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  wenflow_data:
