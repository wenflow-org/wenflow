name: Quality Check

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: file:./ci-main.db
  SYSTEM_DATABASE_URL: file:./ci-system.db
  JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
  SECRET_ENCRYPTION_CURRENT_KEY_ID: ci
  SECRET_ENCRYPTION_KEYS: ci:AwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwM=
  NODE_ENV: test

# 三个阶段可以在本地用 `npm run check:quality` / `check:test` / `check:build`
# 逐条复现；CI 只是把它们拆到并行 job，避免单个 20 分钟 job 同时背所有检查。
jobs:
  quality:
    name: Quality (secrets / types / prompts / lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Generate Prisma clients
        run: npm run prisma:generate
        working-directory: backend
      - name: Scan reachable Git history for secrets
        run: npm run security:scan:history
      - name: Run quality checks
        run: npm run check:quality

  # ── Tests 重构（2026-11-10 内存账单）：原单 job `jest --runInBand --coverage` 把 772 套件
  #    塞进一个进程，插桩内存随套件线性累积，4GB 默认堆必爆（run#488 实证），6GB 只是把
  #    上限抬高。改为矩阵分片：3 个并行 job 各背 1/3 套件（堆 ~2GB，默认 4GB 足够），
  #    墙钟时间也降到 1/3 上下；合并 job 用 istanbul 求和恢复全局覆盖率并统一验阈值
  #    （分片内仍 --runInBand 串行，SQLite 单写者约束不变，测试行为零变化）。
  test-backend:
    name: Tests backend (coverage, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma clients
        run: npm run prisma:generate
        working-directory: backend
      - name: Deploy database migrations
        run: npm --prefix backend run prisma:migrate:deploy:all
      - name: Run backend tests with coverage (shard)
        run: npm --prefix backend run test:coverage -- --shard=${{ matrix.shard }}/3
        # 分片后堆占用 ~1/3；4096 只是防单分片撞到大套件的保险帽。
        # COVERAGE_THRESHOLDS_OFF：分片覆盖率天然低于全局阈值，jest 末自验关闭，
        # 阈值由 coverage-merge 合并后统一验收（见 jest.config.js 注释）。
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          COVERAGE_THRESHOLDS_OFF: '1'
      - name: Upload backend coverage shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: backend/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  test-frontend:
    name: Tests frontend (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests with coverage
        run: npm run test:coverage
        working-directory: frontend
      - name: Upload frontend coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  coverage-merge:
    name: Coverage merge & thresholds (backend)
    needs: test-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Download backend coverage shards
        uses: actions/download-artifact@v4
        with:
          pattern: backend-coverage-shard-*
          path: coverage-shards
      - name: Merge shards & enforce global thresholds
        # istanbul-lib-coverage 依赖解析在脚本自身目录（backend/node_modules），根目录运行即可；
        # 分片产物落在仓库根 coverage-shards/<artifact 名>/（download-artifact v4 布局）
        run: node backend/scripts/merge-coverage.mjs coverage-shards/backend-coverage-shard-1/coverage-final.json coverage-shards/backend-coverage-shard-2/coverage-final.json coverage-shards/backend-coverage-shard-3/coverage-final.json
      - name: Upload merged backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-merged
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build (backend / frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Generate Prisma clients
        run: npm run prisma:generate
        working-directory: backend
      - name: Build backend and frontend
        run: npm run check:build
