<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：移动端软键盘弹起时布局视口同步收缩，
       固定 100dvh 的对话页（goal/learn）composer 不被键盘盖住；不影响桌面与 iOS 默认行为。
       viewport-fit=cover：页面铺进刘海/底部横条区域，env(safe-area-inset-*) 才有非零值，
       底部 tabbar 与吸底动作条靠它避让 iOS 底部横条（2026-09-25 移动端框架审查） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="问流 WenFlow — 先说清你想解决的事，再开始学习。把模糊目标拆成可执行的学习路径，在对话和反馈中持续调整。" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>问流 WenFlow</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      /* 最早执行：在CSS加载前就设好背景色，防止白闪。
         key 与 utils/theme.ts 保持一致：主 key v2_theme + 兼容 key wenflow-theme，
         双 key 解析后显式归一化，避免「刷新时仅暗色生效、亮色被回退系统偏好」。 */
      (function(){
        var t = null;
        try {
          t = localStorage.getItem('v2_theme') || localStorage.getItem('wenflow-theme');
        } catch (e) {}
        var dark = t === 'dark' || (!t && matchMedia('(prefers-color-scheme:dark)').matches);
        var mode = dark ? 'dark' : 'light';
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.classList.add('dark');
        }
        try {
          localStorage.setItem('v2_theme', mode);
          localStorage.setItem('wenflow-theme', mode);
        } catch (e) {}
        /* 与 --mk-bg 对齐（亮 #f7f8fa / 暗 #141415）：此前暗色写死 #0f1620，与主题 token
           #141415 不同值；applyDocumentTheme 运行后会清掉这份内联交由样式表接管，
           这里的字面量只负责 CSS 加载前的一帧，值对齐即可避免载入瞬间的色跳。 */
        var c = dark ? '#141415' : '#f7f8fa';
        document.body.style.background = c;
        document.body.style.color = dark ? '#efeff0' : '#1a2a44';
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
