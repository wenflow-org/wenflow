<!DOCTYPE html>
<html>
<head>
  <title>Blueprint Compiler Test</title>
</head>
<body>
  <h1>Blueprint Compiler Test</h1>
  <button onclick="testCompile()">编译 goal-conversation</button>
  <pre id="output"></pre>

  <script type="module">
    import { loadYamlBlueprint } from '/src/utils/blueprintParser.ts'
    import { compileBlueprint } from '/src/utils/blueprintCompiler.ts'
    
    window.testCompile = async function() {
      const output = document.getElementById('output')
      output.textContent = '加载中...\n'
      
      try {
        // 加载蓝图
        output.textContent += '=== 1. 加载 YAML 蓝图 ===\n'
        const blueprint = await loadYamlBlueprint('goal-conversation')
        output.textContent += `✅ 加载成功\n`
        output.textContent += `蓝图 ID: ${blueprint.blueprintId}\n`
        output.textContent += `名称: ${blueprint.name}\n\n`
        
        // 编译
        output.textContent += '=== 2. 编译蓝图 ===\n'
        const compiled = compileBlueprint(blueprint)
        output.textContent += `✅ 编译成功\n`
        output.textContent += `编译结果长度: ${compiled.length} 字符\n\n`
        
        // 统计
        const lines = compiled.split('\n')
        const ruleCount = (compiled.match(/RULE-\d{2}/g) || []).length
        const outCount = (compiled.match(/OUT-\d{2}/g) || []).length
        const conCount = (compiled.match(/CON-\d{2}/g) || []).length
        
        output.textContent += '=== 3. 编译统计 ===\n'
        output.textContent += `总行数: ${lines.length}\n`
        output.textContent += `RULE 规则数: ${ruleCount}\n`
        output.textContent += `OUT 规则数: ${outCount}\n`
        output.textContent += `CON 约束数: ${conCount}\n\n`
        
        // 预览
        output.textContent += '=== 4. 编译结果预览（前 800 字符）===\n'
        output.textContent += compiled.substring(0, 800) + '\n...\n'
        
        // 保存完整结果
        console.log('=== 完整编译结果 ===')
        console.log(compiled)
        
      } catch (error) {
        output.textContent += `\n❌ 错误: ${error.message}\n`
        console.error(error)
      }
    }
  </script>
</body>
</html>
