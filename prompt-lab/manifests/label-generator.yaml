name: default-skill-label-generator
archetype: copywriter
description: 学习路径标签生成器
acceptableAgentIds: [skill:label-generator]
publish: { enabled: true, exportTargets: [platform-prompts] }
runtimeDefaults: { tier: chat, temperature: 0.7, maxTokens: 2000, model: null, thinkingMode: default, reasoningEffort: default }
promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: copy
