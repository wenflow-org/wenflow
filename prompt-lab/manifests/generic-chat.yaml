version: prompt-lab-manifest/v1
skillId: generic-chat
agentId: skill:generic-chat
name: default-skill-generic-chat
archetype: conversational
description: 平台通用文本能力处理器
acceptableAgentIds: [skill:generic-chat]
publish: { enabled: true, exportTargets: [platform-prompts] }
promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: conversation
  interactionMode: turn
