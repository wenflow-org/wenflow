version: prompt-lab-manifest/v1

skillId: stage-designer
agentId: skill:stage-designer

name: default-skill-stage-designer
archetype: generator
description: 阶段内 subtasks 设计

acceptableAgentIds:
  - skill:stage-designer
  - stage-designer

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.3
  maxTokens: 32000
  model: null
  thinkingMode: default
  reasoningEffort: default

promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: generation
  interactionMode: snapshot
  input: { transport: json, schemaSource: skill-definition }
  output: { media: json, schemaSource: runtime-validator, envelope: adapter }
  context: { envelope: context-envelope/v1, delivery: sidecar, modelExposure: projected }
  failurePolicy: retry

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState:
    domain: path-generation
    phases:
      - stage-designed
      - stage-design-failed
    defaultPhase: stage-designed
    terminalPhases:
      - stage-designed
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: none
    stateOwner: none
    description: snapshot-context：单阶段 subtasks 生成
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - path-phase
  - generator
  - prompt-lab-source

notes: >
  路径阶段细化 skill。
