version: prompt-lab-manifest/v1

skillId: path-scene-framing
agentId: skill:path-scene-framing

name: default-skill-path-scene-framing
archetype: generator
description: 路径场景 framing / 输入归一

acceptableAgentIds:
  - skill:path-scene-framing
  - path-scene-framing

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.2
  maxTokens: 32000
  model: null
  thinkingMode: default
  reasoningEffort: default

promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: normalization
  interactionMode: snapshot
  input: { transport: json, schemaSource: skill-definition }
  output: { media: json, schemaSource: runtime-validator, envelope: adapter }
  context: { envelope: context-envelope/v1, delivery: sidecar, modelExposure: projected }
  failurePolicy: retry

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState:
    domain: path-generation
    phases:
      - input-framed
    defaultPhase: input-framed
    terminalPhases:
      - input-framed
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: none
    stateOwner: none
    description: snapshot-context：一次性 framing，无跨轮状态
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - path-phase
  - normalization
  - prompt-lab-source

notes: >
  路径生成前置 framing skill。
