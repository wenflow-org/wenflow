version: prompt-lab-manifest/v1

skillId: path-scene-framing
agentId: skill:path-scene-framing

name: default-skill-path-scene-framing
archetype: extractor
description: 路径场景 framing / 输入归一

acceptableAgentIds:
  - skill:path-scene-framing
  - path-scene-framing

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.3
  maxTokens: 4000
  model: null
  thinkingMode: default
  reasoningEffort: default

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState:
    domain: path-generation
    phases:
      - input-framed
    defaultPhase: input-framed
    terminalPhases:
      - input-framed
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: none
    stateOwner: none
    description: snapshot-context：一次性 framing，无跨轮状态
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - path-phase
  - extractor
  - prompt-lab-source

notes: >
  路径生成前置 framing skill。
