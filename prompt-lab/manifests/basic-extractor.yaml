runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState: { domain: content-extraction, phases: [content-extracted], defaultPhase: content-extracted, terminalPhases: [content-extracted], statusValues: [succeeded, partial, blocked, failed] }
  contextUpdate: { mode: none, stateOwner: none }
