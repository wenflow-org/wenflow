version: prompt-lab-manifest/v1

skillId: session-wrapup
agentId: skill:session-wrapup

name: default-skill-session-wrapup
archetype: distiller
description: 课后总结生成器

acceptableAgentIds:
  - skill:session-wrapup
  - session-wrapup-agent

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.7
  maxTokens: 4000
  model: null
  thinkingMode: default
  reasoningEffort: default

promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: distillation
  interactionMode: batch
  input: { transport: tagged-text, schemaSource: skill-definition }
  output: { media: json, schemaSource: runtime-validator, envelope: adapter }
  context: { envelope: context-envelope/v1, delivery: sidecar, modelExposure: projected }
  failurePolicy: blocking

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: thread-context
  businessState:
    domain: teaching
    phases:
      - wrapup-generated
      - session-finalized
    defaultPhase: wrapup-generated
    terminalPhases:
      - session-finalized
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: thread-state
    stateOwner: orchestrator
    description: thread-context：基于本课结构化证据生成 wrapup；终态由编排层落盘
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - core-skill
  - distiller
  - learn-phase
  - prompt-lab-source

notes: >
  课后总结 skill。输入依赖会话线程与证据，状态归 orchestrator。
