version: prompt-lab-manifest/v1

skillId: goal-conversation
agentId: skill:goal-conversation

name: default-skill-goal-conversation
archetype: conversational
description: 学习目标澄清与方向收敛助手

acceptableAgentIds:
  - skill:goal-conversation
  - goal-conversation

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.7
  maxTokens: 8000
  model: null
  thinkingMode: default
  reasoningEffort: default

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: state-refresh
  businessState:
    domain: goal-conversation
    phases:
      - understanding
      - proposing
      - ready
      - completed
    defaultPhase: understanding
    terminalPhases:
      - ready
      - completed
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: state-refresh
    stateOwner: runtime
    description: state-refresh：以 businessState 为主记忆，每轮输入 + 可见上下文 → nextState
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - core-skill
  - conversational
  - prompt-lab-source

notes: >
  这是 Prompt Lab manifest 接入的种子文件。
  目标是让 publish/export metadata 逐步从 Prompt Lab 自己产生，
  而不是继续回读平台现有 prompts frontmatter。