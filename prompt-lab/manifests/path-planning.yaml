version: prompt-lab-manifest/v1

skillId: path-planning
agentId: skill:path-planning

name: default-skill-path-planning
archetype: generator
description: 学习路径规划

acceptableAgentIds:
  - skill:path-planning
  - path-agent

publish:
  enabled: true
  exportTargets:
    - platform-prompts

runtimeDefaults:
  tier: chat
  temperature: 0.5
  maxTokens: 32000
  model: null
  thinkingMode: default
  reasoningEffort: default

promptContract:
  version: skill-prompt-contract/v2
  executionMode: llm
  artifactKind: generation
  interactionMode: snapshot
  input: { transport: tagged-text, schemaSource: skill-definition }
  output: { media: json, schemaSource: runtime-validator, envelope: adapter }
  context: { envelope: context-envelope/v1, delivery: sidecar, modelExposure: projected }
  failurePolicy: retry

runtimeContract:
  version: prompt-runtime-contract/v1
  contextMode: snapshot-context
  businessState:
    domain: path-generation
    phases:
      - core-path-generated
      - path-generation-failed
    defaultPhase: core-path-generated
    terminalPhases:
      - core-path-generated
    statusValues:
      - succeeded
      - partial
      - blocked
      - failed
  contextUpdate:
    mode: none
    stateOwner: none
    description: snapshot-context：一次性生成核心路径骨架，无跨轮状态刷新
  outputEnvelope: adapter

ownership:
  tier: production
  visibility: internal

tags:
  - core-skill
  - generator
  - path-phase
  - prompt-lab-source

notes: >
  路径阶段主生成 skill。单次快照输入，产出结构化路径。
