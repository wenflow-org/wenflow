version: prompt-lab-manifest/v1
skillId: data-mapping
agentId: skill:data-mapping
name: default-skill-data-mapping
archetype: extractor
description: 数据映射器
acceptableAgentIds: [skill:data-mapping]
publish: { enabled: true, exportTargets: [platform-prompts] }
runtimeDefaults: { tier: chat, temperature: 0.3, maxTokens: 2500, model: null, thinkingMode: default, reasoningEffort: default }
promptContract:
