    story:
      id: story_mom-restart-job
      title: 停在三年前的简历
      sourceType: work
      storyOutline: 孩子上幼儿园了，苏晴投了二十几份简历，只来了两个面试。第一家的面试官翻着她的简历问「这三年你干什么去了」，她准备的答案全忘了。猎头朋友看了她的简历直摇头：技能栏还是三年前的品牌活动执行，可她投的岗位要求里写的是直播策划和短视频投放。她对着简历坐了一晚上，不知道从哪改起。
      triggerEvent: 面试被空窗期问题击中 + 猎头点破技能错位。
      visibleOpening: 我做了五年品牌然后带孩子三年，现在投简历基本没回音，面试还被问这三年干了什么，我是不是已经被行业淘汰了？
      hiddenDetails:
        - 她这三年并不空白：团购社群、幼儿园家委会活动、小红书记录育儿，都是可提炼的经历，但她不认为这些「算」
        - 面试官那个问题她最怕的不是答不出，是答完对方脸上的礼貌
        - 她偷偷羡慕做自媒体的全职妈妈，但觉得「那不算正经工作」
      misdiagnosis: 以为空窗期只能被动的「解释」，不知道可以主动「重写」。
      pressurePoints: [龄与空窗的双重审视, 被礼貌地拒绝]
      behaviorHooks: [道歉式开场, 海投同一份简历, 收集课程不落地]
      problemKnowledge:
        domainFamiliarity: medium
        knownConcepts: [品牌活动执行, 传统文案, Excel 基础]
        struggleConcepts: [简历空窗期叙事, 新媒体内容方法, 面试表达, 行业信息差]
        selfAssessment: 自认「简历上没有拿得出手的三年」。
        hiddenGaps: [不知道空窗期的正确用法是「重写」而不是「解释」——社群运营数据、家委会招新方案都能以成果形式写进简历；也不知道目标岗位的技能关键词该逐条对齐，而不是一份简历投所有]
      goalSeed:
        domain: 求职 / 新媒体运营转型
        goalType: problem_driven
        surfaceGoal: 拿到面试通过、重返职场
        realProblem: 简历与目标岗位技能关键词错位 + 空窗期叙事缺位，用「海投」代替「定向改写」，面试没有演练脚本
        motivation: career
        urgencyHint: 孩子已入园，家庭期待她「尽快有结果」
        constraints: [带娃时间碎片, 三年行业信息差, 自信受挫]
        expectedOutcome: 一份对齐岗位关键词的简历 + 空窗期叙事脚本 + 三个高频面试题的演练答案
      disclosurePlan:
        opening: 道歉式开场 + 讲面试失利
        revelationTriggers: [被问「你小红书记录育儿坚持了多久」「家委会招新方案是谁做的」]
        resistancePoints: [被建议从助理岗做起]
        idealProbe: 让她把社群和家委会的两件事按「目标-动作-结果」各说一遍
    consistencyNotes:
      - hinting / watching 决定她先给失败结果再等引导，不主动列亮点
      - 「不急，慢慢找」对应 emotionalTriggers，是他怯于行动的家庭底噪
      - hiddenGaps 把「被淘汰了」重新归因到「简历错位 + 空窗可重写」，且平台不替她下「你没问题」的结论，用她自己的经历逼她看见

