        resistancePoints: [被灌鸡汤、被劝放弃]
        idealProbe: 让她复述最近一次计划崩盘的全过程
    consistencyNotes:
      - expressive / verbose 决定首轮信息多且带焦虑
      - 「不够自律」对应 misdiagnosis，realProblem 指向机制而非意志力
      - 家人压力（emotionalTriggers）是首句情绪底色
