# 预制虚拟学习者（builtin presets）—— File-as-Truth
#
# 定位：平台的「固定评审语料 / 输入种子」。每条 = 一个稳定人物（personaSeed）+ 一个故事（story）。
# 范围：只到「故事」为止；Goal / Path / Learn / 情绪 / 记忆 / 裁判等下游一律运行时动态生成。
# 不含答案键：本文件不冻结期望结论。
#
# 消费方：backend/src/virtual-lab/builtin-learners（启动时 ensureBuiltinVirtualLearners 按 presetKey 幂等同步进 DB）。
# 修改规则：改内容请同步递增该条 presetVersion，否则已存在实例不会被刷新；删除条目不会自动删除已建实例。
#
# 设计稿见 doc/VIRTUAL_LEARNER_PRESET_DESIGN.md
#
# 变更记录（corpus 版本）
# - v1（≤ 2026-09-20）：原始 14 条。availableTime = 7 minimal / 4 moderate / 3 abundant。
#   问题：负荷收紧分支覆盖过半 ⇒ 体量/资源被"时间紧"主导（实测 275 例里 46% 被硬钳成恰好 2 段）。
# - v2（2026-09-21）：均衡负荷轴 —— 林慧敏 / 陈默 / 周敏 / 刘芳 由 minimal 改 moderate
#   （该 4 条 presetVersion 2 → 3），保留王婷 / 苏芮 / 孙浩 三条真正「时间极少」的样本。
#   现行分布：3 minimal / 8 moderate / 3 abundant。
#   **注意**：这 4 条在 v1 下跑出的历史数据与 v2 不可直接比较（人设字段变了）。
# - v3（2026-09-22）：项目级修整（不含个案判断）——
#   ① 时间轴自洽：coverageAxes 统一 low_time/mid_time/abundant_time，与 availableTime 对齐
#      （林慧敏 low_time→mid_time；王婷/苏芮/孙浩补 low_time；徐国栋/赵鹏/吴倩补 abundant_time）；
#   ② 去命名水平词：retiree-phone-photography 的 domain「手机摄影入门」→「手机拍照与照片整理」
#      （路径命名硬规则禁水平词，domain 会进 subject/名称链路）；
#   ③ 新增可选字段 fixtureMaterials：预制学习者自带附件夹具，VL 跑批先注入再起 Goal，
#      用于覆盖「附件 → 路径 → 任务 → 课堂(materialRefs)」（周敏/陈默 各挂 1 件）。
#   **注意**：①②③ 改动的人设/覆盖轴与历史数据不可直接比较（故相关条目 presetVersion +1）。
#   生效方式：预设随服务启动同步（ensureBuiltinVirtualLearners）；改动需重启才落到 DB。
# - v4（2026-09-27）：真实情景升级——拍板：故事补**网上可查证的真实资料**，换真实情景问题；
#   强实体操作域（学开车/学画画/学视频剪辑一类，平台不可观测）暂不纳入。
#   ① electrician 落地真实考制：理论 100 题（判断+选择）合格线 80 分、理论过线才考实操四科目
#     （科目三机考）、题库模拟需三次 80+、线上刷课人脸识别（模考与故事 58→78，仍是「差两分」）；
#   ② nurse 落地健康管理师（三级）真实考制：两科机考各 100 分 60 合格、技能=共用题干单选
#     +不定项案例分析、基础 16 章、2020 年后为职业技能等级证书（她的「值不值」有了真实锚点）；
#   ③ gaokao 落地全国卷理综真实结构：300 分/150 分钟/38 题/选择题 21 题×6 分（多选不全得 3 分）、
#     物理 110 化学 100 生物 90（「涂 30 分」精确为 5 道选择题）；
#   ④ kaoyan 精确为真实单科线悲剧：总分过工学 A 区线（273），英语单科 35 巡线 38 差 3 分；
#   ⑤ zhongkao 落地河南真实框架：总分 730（语数英各 120+体育与实验操作计入）、普高最低控制
#     线 ~420（一模 405 差 15）；
#   ⑥ newmom 落地《7～24 月龄婴幼儿喂养指南》：富铁泥糊起步、由稀到稠由细到粗、每种新食物
#     观察 2-3 天、7-9 月龄应过渡末状碎末手指食物；
#   ⑦ 其余条目轻注真实做法词汇（动碰盘/先进先出、得分点三段式、报价结构、6 秒暂停+非暴力
#     沟通四步、触发点清单+离场暗号、一次一技+结对、行程问题分类）；
#   ⑧ retiree-phone-photography 退役（照片质量平台不可观测，与学画画/剪辑同族；已建实例不自动
#     删，用 prune-virtual-learners 清理）；替代条目 retiree-xiangqi-openings（象棋，兴趣轴，
#     棋谱符号可文本观测）；新增 backend-eng-distributed（mastery 意图：系统掌握分布式一致性，
#     补预置语料零 mastery 的已证缺口）。
#   ⑨ 同日补充四条场景（同拍板：真实情景、平台可观测）——
#     civil-service-onsite（在职考公：行测 120-130 题/120 分钟、资料分析 20 道 20-35 分钟性价比
#       之王、申论 3 小时——考制联网实锤；补「边工作边考」人群轴）；
#     fatty-liver-turnaround（体检脂肪肝后慢病管理：逆转核心=减重 7%-10%、每周 0.5-1kg、
#       不干预 15-25% 进展肝炎——指南数值联网实锤；补 self_management 第二条与健康行为改变域）；
#     mom-restart-job（宝妈重返职场：简历空窗期叙事+技能关键词错位，简历/面试全文本可观测；
#       补求职轴）；
#     fund-loss-rebalance（基金亏 30% 学资产配置：满仓单一主题+损失厌恶，教决策框架不荐产品
#       ——合规边界写入 behaviorBoundaries；补理财域）。
#   **注意**：本批改动条目与历史数据不可直接比较（presetVersion 均 +1；新条目 v1）。

version: 1

# 会话预算（可复现运行条件的一部分：同一 preset 两次运行的护栏一致，分数才可比）。
# 说明见 backend/src/virtual-lab/session-budget.ts：
# - turnChunkPerLesson：每课自动推进的「分片」回合数（跑满不收敛=分片边界，可续，不是失败）
# - costCeiling：会话累计 AI 调用「成本护栏」（到顶=基础设施事故，终态）；null=不限
# - maxRetriesPerStep：单步上游调用重试次数
# - noProgressChunkLimit：连续多少个分片无净进展判定卡死
defaultBudget:
  turnChunkPerLesson: 60
  costCeiling: 1500
  maxRetriesPerStep: 8
  noProgressChunkLimit: 3

presets:

  - presetKey: student-geo-essay
    presetVersion: 6
    fixtureMaterials:
      - file: text/课件-MIT6.006-01-真实幻灯片.pptx
        note: 有真实标题结构的课件（27 个小标题）——验证 materialRefs 的章节级引用
    sourceType: study
    goalType: exam_prep
    scope: in_scope
    coverageAxes: [study, exam_prep, necessity, reading, terse, mid_time]
    personaSeed:
      nameHint: 陈默
      age: 17
      occupation: 高二文科生
      education: 县城普通高中在读
      background: 成绩中上，地理是短板；爸妈都是老师，对他期望高，最怕他掉出一本线。
      knownConcepts: [经纬度, 等高线, 气候类型]
      struggleConcepts: [综合题答题结构, 材料信息提取, 区位分析]
      learningStyle: reading
      motivationType: necessity
      availableTime: moderate
      techComfort: high
      priorAttempts: 背过很多答题模板，考试时想不起来用。
      corePersonality: 内向、要强、表面平静内里焦虑；不轻易说不会，怕被看成笨。
      personalityDrivers:
        - 维持在班级前十
        - 不想让教地理的爸爸失望
      communicationStyle: 话少，问一句答一句，喜欢用「差不多」「还行」含糊带过。
      motivationOrientation: 偏表现型——要分数、要排名
      emotionalBaseline: 平时安静，成绩一波动就失眠。
      emotionalTriggers:
        - 排名下滑
        - 被爸爸问成绩
        - 同学说「这题你都不会」
      resiliencePattern: 受挫就闷头刷题，但方法不变。
      metacognitiveProfile: 分不清「背过模板」和「会用模板」，以为记住等于会做。
      cognitiveLoadTolerance: 中，但反感大段空话。
      selfRegulationStyle: 有计划表，执行靠考试倒逼。
      digitalLiteracy: high
      helpSeekingPattern: 先自己憋，憋到成绩崩了才问，且只问具体某道题。
      adversarialPattern: 被下判断式结论（「你方法不对」）会沉默抗拒，不反驳但也不照做。
      memoryRepairPattern: 不会的题跳过，假装没看到。
      behaviorBoundaries:
        - 不接受被说「你基础差」
        - 不接受空泛励志
      learningPreferences: [要能马上用在一道题上的方法, 要具体范例]
      failurePatterns:
        - 只背模板不练迁移
        - 大题只写要点不展开
      behavioralProfileSummary: 一个内向要强、用「背」掩盖「不会迁移」的文科生。
      personalityTraits:
        verbosity: terse
        enthusiasm: low
        confusionStyle: hinting
        patience: normal
        questionStyle: clarifying
        emotionalRange: flat
    story:
      id: story_student-geo-essay
      title: 写不到点上的大题
      sourceType: study
      storyOutline: 期中考试地理从 85 掉到 74，综合题三道全丢分。班主任把家长叫去谈话，爸爸回家没骂他，只说「地理你不是一直还行吗」，那句话让他更难受。他自己也说不清到底哪儿不会。
      triggerEvent: 期中地理排名下滑，被班主任找家长。
      visibleOpening: 我地理老卡在大题上，材料我看得懂，可一写就写不到点上，老师说我答得没层次，这怎么练？
      hiddenDetails:
        - 他把「看得懂材料」当成「会答题」
        - 从没分析过标准答案的得分点结构
        - 怕被爸爸知道是方法问题
      misdiagnosis: 以为是不够努力，只要再多背。
      pressurePoints: [被拿来和别人比, 被指出方法问题]
      behaviorHooks: [把问题归结为「没背够」, 回避分析错题]
      problemKnowledge:
        domainFamiliarity: medium
        knownConcepts: [经纬度, 等高线, 气候类型]
        struggleConcepts: [综合题答题结构, 材料信息提取, 区位分析]
        selfAssessment: 自认「基础还行，就是大题不会写」。
        hiddenGaps: [不知道大题按「得分点」给分——综合题的规范结构是先描述特征、再析成因、后说影响/措施，阅卷按点计分；他从没对着标准答案数过自己漏了哪几个点]
      goalSeed:
        domain: 高中地理
        goalType: exam_prep
        surfaceGoal: 提高地理综合题得分
        realProblem: 缺一套「材料→考点→规范表达」的答题结构，把背诵当解题
        motivation: necessity
        urgencyHint: 高考倒计时
        constraints: [时间紧, 学校节奏固定]
        expectedOutcome: 知道大题怎么下笔、怎么分层
      disclosurePlan:
        opening: 直接问「怎么练」
        revelationTriggers: [被问「你有没有对过标准答案的给分点」]
        resistancePoints: [被定义为方法问题]
        idealProbe: 让他现场讲一道做过的题是怎么答的
    consistencyNotes:
      - terse / flat 决定首轮短、情绪不外露，卡点靠追问才露
      - hiddenGaps 与 misdiagnosis 形成「多背 vs 会迁移」的诊断张力
      - 爸爸的期望对应 personalityDrivers 与 emotionalTriggers

  - presetKey: nurse-career-transition
    presetVersion: 6
    # 附件夹具：VL 跑批时先注入为「已上传资料」，覆盖「附件 → 路径 → 任务 → 课堂(materialRefs)」这条链
    fixtureMaterials:
      - file: text/指南-抽取.txt
        note: 官方指南类资料（长文本、无标题结构）——验证章节回退与逐字引文核对
    sourceType: work
    goalType: foundation_building
    scope: in_scope
    coverageAxes: [work, foundation_building, career, reading, high_patience, mid_time]
    personaSeed:
      nameHint: 周敏
      age: 40
      occupation: 三甲医院 ICU 护士
      education: 护理本科
      background: 临床十六年，长期夜班。体检查出甲状腺结节后想转岗做健康管理，但不知道从哪开始。
      knownConcepts: [基础护理, 生命体征, 慢病基本知识]
      struggleConcepts: [健康管理师考证范围, 营养学基础, 健康风险评估]
      learningStyle: reading
      motivationType: career
      availableTime: moderate
      techComfort: medium
      priorAttempts: 下载过考试大纲，看了一眼就放下了。
      corePersonality: 务实、要强，习惯照顾别人不习惯求助；一旦决定就认真。
      personalityDrivers:
        - 身体发出的警告
        - 想有一份可持续的职业
      communicationStyle: 直接、说重点，不绕弯，情绪平稳。
      motivationOrientation: 现实驱动，但愿意为掌握下功夫
      emotionalBaseline: 稳定偏疲惫，谈到身体时流露焦虑。
      emotionalTriggers:
        - 被说「护士转行能干嘛」
        - 想到又要把夜班排满
      resiliencePattern: 认准了就硬啃，但怕选错方向。
      metacognitiveProfile: 有临床经验，但分不清「经验」与「考证知识」的差别。
      cognitiveLoadTolerance: 高，能啃大部头。
      selfRegulationStyle: 靠目标和计划
      digitalLiteracy: medium
      helpSeekingPattern: 先查资料做足功课才问，且问得很具体。
      adversarialPattern: 被给太笼统的建议会直接追问「具体呢」。
      memoryRepairPattern: 没弄懂的会反复查。
      behaviorBoundaries:
        - 不接受「你这年龄别折腾了」
      learningPreferences: [要清晰的范围和路径, 要能对接证书]
      failurePatterns:
        - 目标太大不知从哪起手
        - 容易陷在「先了解清楚再开始」
      behavioralProfileSummary: 一个务实疲惫、想转行但摸不着入口的中年护士。
      personalityTraits:
        verbosity: terse
        enthusiasm: normal
        confusionStyle: direct
        patience: high
        questionStyle: clarifying
        emotionalRange: moderate
    story:
      id: story_nurse-career-transition
      title: 熬不动的夜班
      sourceType: work
      storyOutline: 连续三个夜班后体检查出甲状腺结节，医生说问题不大但要少熬夜。周敏第一次认真想转岗。她查了健康管理师，但网上信息太杂，考什么、值不值、从哪学都说不清。
      triggerEvent: 体检查出结节，加上医生的叮嘱。
      visibleOpening: 我在 ICU 干了十几年，实在熬不动夜班了，想考个健康管理师转出去，可考啥我一点谱都没有，从哪儿下手？
      hiddenDetails:
        - 她没跟家人说要转行，怕被劝
        - 其实不确定证书到底有没有用——查到 2020 年后健康管理师退出了国家职业资格目录，改成职业技能等级证书，她分不清这算「官方证书」还是「培训证」
        - 她只有零散的下班时间
      misdiagnosis: 以为「先了解一下」就能开始。
      pressurePoints: [年龄焦虑, 方向不确定]
      behaviorHooks: [反复收集资料却不开始, 要求一个权威结论]
      problemKnowledge:
        domainFamiliarity: medium
        knownConcepts: [基础护理, 生命体征, 慢病基本知识]
        struggleConcepts: [健康管理师考证范围, 营养学基础, 健康风险评估]
        selfAssessment: 自认「临床没问题，转行两眼黑」。
        hiddenGaps: [不知道考试真实结构：两科机考各 100 分 60 合格，技能考共用题干单选+不定项案例分析，基础知识 16 章（临床/预防/慢病/流行病学/营养与食品安全/心理/康复/健康信息学等），与她临床经验重叠度其实很高]
      goalSeed:
        domain: 健康管理 / 职业转型
        goalType: foundation_building
        surfaceGoal: 考健康管理师转岗
        realProblem: 缺对目标职业与证书的清晰认知，导致无法判断方向、无法起步
        motivation: career
        urgencyHint: 健康警示，无硬截止但紧迫
        constraints: [仍在上夜班, 时间零碎, 家庭负担]
        expectedOutcome: 能说清该不该转、怎么转
      disclosurePlan:
        opening: 直接咨询「从哪下手」
        revelationTriggers: [被问「你查到的信息里哪些互相矛盾」]
        resistancePoints: [被劝退]
        idealProbe: 问她现在有几分把握、缺什么才敢决定
    consistencyNotes:
      - high patience / terse 决定她能接受系统讲解，但要具体
      - hiddenGaps 把「信息太多」与「方向未定」连接起来
      - 医生的叮嘱对应 emotionalTriggers 与 urgencyHint

