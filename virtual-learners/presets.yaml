      sourceType: study
      storyOutline: 省考公告出了，韩磊专业能报的岗只剩三个，今年是年龄线内倒数第二次机会。行测模考两套，120 分钟 120-130 道题他只做完 95 道，资料分析 20 道几乎全空——他不知道那恰恰是公认性价比最高的模块。申论他连笔都没动过。对象微信问「今年到底行不行」，他把手机扣在桌上。
      triggerEvent: 省考公告发布 + 模考资料分析全空。
      visibleOpening: 行测我每次都做不完，资料分析全空了，是不是我数学太差，这种题练得出来吗？
      hiddenDetails:
