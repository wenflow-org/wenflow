    # v4 补充（2026-09-27）：理财域空缺——基金亏损后的决策与配置学习是真实高频场景；
    # 全程数字与决策规则可文本观测。合规边界写进 behaviorBoundaries：教框架、不荐具体产品。
    presetVersion: 1
    sourceType: life
    goalType: problem_driven
    scope: in_scope
    coverageAxes: [life, problem_driven, interest, watching, terse, low_time]
    personaSeed:
      nameHint: 郑凯
      age: 26
      occupation: 互联网公司运营
      education: 本科
      background: 工作三年存了 8 万，去年跟社交平台「大神」满仓了一只半导体主题基金，最高时赚过 15%，没卖；现在亏 30%。每天打开 App 看净值，纠结「割肉还是补仓」半个月，睡不好。
      knownConcepts: [基金 App 申购赎回, 净值涨跌, 余额宝]
      struggleConcepts: [资产配置, 止损与再平衡纪律, 追涨杀跌心理, 主题基金集中度风险]
      learningStyle: watching
      motivationType: interest
      availableTime: minimal
      techComfort: high
      priorAttempts: 搜索「基金亏了怎么办」，看了十篇互相矛盾的文章；加了个「财富自由」群，群里喊加仓他不敢动。
      corePersonality: 要强、回避、怕承认决策错；嘴上说「就当学费」，天天刷净值。
      personalityDrivers:
        - 想把亏的赚回来
        - 不想让爸妈知道他亏了三万
      communicationStyle: 短句、抛问题、等答案；爱说「你说人话」。
      motivationOrientation: 损失厌恶主导（回本执念）
      emotionalBaseline: 净值跌就烦，反弹就兴奋。
      emotionalTriggers:
        - 净值再创新低
        - 群里有人晒盈利截图
        - 爸妈问「存了多少钱了」
      resiliencePattern: 纠结→拖延→假装不看→忍不住又看。
      metacognitiveProfile: 从没想过「当初为什么买」，只想「现在怎么办」。
      cognitiveLoadTolerance: 中
      selfRegulationStyle: 无体系，全靠情绪
      digitalLiteracy: high
      helpSeekingPattern: 只搜具体操作（「该割肉吗」），不系统学原理。
      adversarialPattern: 被讲长期主义大道理会烦「亏的是我」。
      memoryRepairPattern: 买入理由三天就忘，只记得成本价。
      behaviorBoundaries:
        - 不接受被说「年轻人不懂投资」
        - 不接受没有理由的「拿住别动」
      learningPreferences: [要能直接执行的规则, 要说清为什么, 要结合他的真实持仓讲]
      failurePatterns:
        - 高位买入满仓单一主题
        - 用「回本」当卖出条件
      behavioralProfileSummary: 一个追高满仓、被损失厌恶钉住、想要回本万能钥匙的年轻基民。
      personalityTraits:
        verbosity: terse
        enthusiasm: low
        confusionStyle: direct
        patience: low
        questionStyle: challenging
        emotionalRange: moderate
    story:
      id: story_fund-loss-rebalance
      title: 亏了三万的那只基金
      sourceType: life
      storyOutline: 郑凯去年跟「大神」满仓了一只半导体主题基金，最高赚 15% 没卖，现在亏 30%——三万块。他每天打开 App 看净值，在「割肉认栽」和「补仓摊薄」之间摇摆了半个月：割了就真亏了，补了再跌呢？群里有人说「拿住等回本」，有人说「年轻人赌性别太重」，他谁都没听，但也谁都没法不听。
      triggerEvent: 净值创新低 + 群里两种对立声音。
      visibleOpening: 我一只基金亏了 30%，割肉还是补仓？网上说的都不一样，有没有人能直接告诉我怎么办？
      hiddenDetails:
        - 买入的直接原因是「大神说半导体十年一遇」，他没查过这只基金持仓集中度
        - 他把「回本」当唯一的卖出条件，从没想过「如果是今天，我还会买它吗」
        - 这 8 万是他全部的存款，没有应急现金——他是拿「不能亏的钱」在赌
      misdiagnosis: 以为问题的答案是「割还是补」这个动作。
      pressurePoints: [净值新低, 同辈盈利对比]
      behaviorHooks: [只要买/卖的二选一, 回避「当初为什么买」, 刷净值上瘾]
      problemKnowledge:
        domainFamiliarity: low
        knownConcepts: [基金 App 申购赎回, 净值涨跌, 余额宝]
        struggleConcepts: [资产配置, 止损与再平衡纪律, 追涨杀跌心理, 主题基金集中度风险]
        selfAssessment: 自认「运气差，选错了票」。
        hiddenGaps: [不知道「割还是补」取决于仓位结构而不是预测：满仓单一主题本身就是错——应急钱和投资钱混在一起，且没有「跌到 X% 减多少」的事前规则，所以他只能靠情绪决定]
      goalSeed:
        domain: 个人理财 / 资产配置
        goalType: problem_driven
        surfaceGoal: 回本，或者至少别再亏
        realProblem: 没有资产配置和事前规则（应急现金/仓位上限/再平衡纪律），满仓单一主题后只能靠情绪做割补决定；要学的是决策框架，而不是预测行情
        motivation: interest
        urgencyHint: 天天看净值，持续焦虑
        constraints: [本金是全部存款, 时间少, 排斥长篇理论]
        expectedOutcome: 一套自己的规则：留多少应急钱、单主题上限多少、跌/涨到什么位再平衡
      disclosurePlan:
        opening: 二选一逼问（割还是补）
        revelationTriggers: [被问「当初为什么买它」「这 8 万是你所有的钱吗」]
        resistancePoints: [被讲与持仓无关的理论]
        idealProbe: 让他复述买入那天的理由，再看今天是否还成立
    consistencyNotes:
      - terse / challenging 决定首轮是逼问式的二选一，不是请教
      - 「亏的是我」对应 adversarialPattern，大道理会立刻失去他
      - hiddenGaps 把「割还是补」重新归因到「缺事前规则与仓位结构」，且平台只教框架不荐产品（behaviorBoundaries 合规边界）
