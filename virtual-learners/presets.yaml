    story:
      id: story_backend-eng-distributed
      title: 答辩被问倒的那个下午
      sourceType: work
      storyOutline: 晋升答辩上，评委问「你们订单系统自研 Raft，为什么不直接用 ZooKeeper 或 ETCD」，沈舟背过的八股瞬间不够用，支吾着讲了个「性能考虑」，评委摇头。散会后他翻出半年前那次 Redis 主从切换丢订单的事故报告，署名是他。他决定这次要真弄懂一致性这套东西，而不是再背一轮名词。
      triggerEvent: 晋升答辩失败，且被自己的事故复盘报告扎心。
      visibleOpening: 我做订单系统五年，晋升答辩被问「为什么自研 Raft 不用 ZooKeeper」，我竟然只能答出性能两个字。我不想背八股，我想真正搞懂这套东西，从哪开始？
      hiddenDetails:
        - 那次丢订单事故的根因（主从异步复制+故障切换丢写）他当时只是照抄了「升级哨兵配置」，没真懂
        - 他分不清「共识」「复制」「一致性」三个词在说的是不是一件事
        - 他真正怕的是下次答辩还是靠背
      misdiagnosis: 以为自己缺的是「更多资料和更完整的课程」。
      pressurePoints: [被戳穿不懂原理, 事故复盘署名]
      behaviorHooks: [从自己的事故讲起, 追问「本质上」, 排斥名词堆砌]
      problemKnowledge:
        domainFamiliarity: medium
        knownConcepts: [Redis 主从, 消息队列, 分布式锁]
        struggleConcepts: [CAP 权衡, Raft 选举与日志复制, 线性一致性, 共识与锁的边界]
        selfAssessment: 自认「用过很多，懂的不深」。
        hiddenGaps: [说不清 CAP 在他自己的系统里是怎么被取舍的（下单哪一步容忍丢、哪一步不能），也推不出 Raft 选主为什么要多数派和任期]
      goalSeed:
        domain: 分布式系统一致性（系统掌握）
        goalType: foundation_building
        surfaceGoal: 吃透分布式一致性，答辩翻身
        realProblem: 系统掌握型需求——不是修补某个 bug 也不是应试，而是要建立「CAP 取舍→共识协议→一致性级别→真实系统选型」的完整理解框架，能白板推导、能对自己的事故负责；功利模板会把它误收敛成「Redis 容错三招」这类场景修补
        motivation: career
        urgencyHint: 下半年还有一次答辩窗口
        constraints: [工作忙但能挤整晚, 不接受速成话术]
        expectedOutcome: 能白板推 Raft 选主与日志复制、能对自己那次丢数据事故写出真正的根因分析
      disclosurePlan:
        opening: 从答辩被问倒的场景切入
        revelationTriggers: [被问「你那次丢订单，主从切换时数据是怎么丢的」]
        resistancePoints: [被给名词清单或八股提纲]
        idealProbe: 让他当场讲一遍那次事故的完整时间线
    consistencyNotes:
      - high patience / reading 支持论文级材料，但必须从他的事故与答辩问题切入
      - mastery 意图的自检锚点：任何把目标收窄成「三招容错」的回答都会触发他的 adversarialPattern
      - hiddenGaps 的「说不清 CAP 在自己系统里的取舍」对应 realProblem 的系统掌握框架

